<head>

<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>ไม่พบหน้า · Course Website</title>
<script>try{if(JSON.parse(localStorage.getItem('skyce-learning-preferences')||'{}').theme==='dark')document.documentElement.dataset.theme='dark'}catch{}</script>
<style>
:root{--bg:#f5f5ee;--paper:#fffefa;--ink:#243e36;--muted:#5f6d63;--line:#dfe5d8;--accent:#285f4b;--on-accent:#fff;color-scheme:light}
html[data-theme=dark]{--bg:#172722;--paper:#1f322b;--ink:#e5ebdf;--muted:#a2b4a7;--line:#354b3f;--accent:#b7d19b;--on-accent:#172722;color-scheme:dark}
*{box-sizing:border-box}
body{min-height:100vh;margin:0;padding:24px 16px;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:17px/1.9 Tahoma,'Leelawadee UI',sans-serif}
main{width:min(100%,520px);padding:36px 28px;border:1px solid var(--line);border-radius:16px;background:var(--paper);text-align:center}
.code{margin:0;color:var(--muted);font:14px/1.6 monospace;letter-spacing:2px}
h1{margin:8px 0;font-size:28px;line-height:1.5}
p{margin:0 0 8px;color:var(--muted)}
a{display:inline-flex;align-items:center;min-height:44px;margin-top:16px;padding:6px 20px;border-radius:8px;background:var(--accent);color:var(--on-accent);text-decoration:none;font-weight:bold}
a:focus-visible{outline:3px solid #b29440;outline-offset:3px}
</style>
</head>
<body>
<main>
<p class="code">404</p>
<h1>ไม่พบหน้านี้</h1>

</main>
</body>
</html>
