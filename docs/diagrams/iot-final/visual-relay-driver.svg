<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="2714" viewBox="0 0 560 1357" role="img" aria-labelledby="title desc" lang="th"><title id="title">GPIO ส่ง Logic ไม่ขับ Coil โดยตรง</title><desc id="desc">GPIO26เข้าขาINของdriver/moduleที่รับlogic3.3VและactiveLOWสมมติ;moduleมีไฟตามสเปก;contactsCOM/NOต่อLEDแรงดันต่ำผ่าน330ΩไปLOADreturn ไม่ใช้mains</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9" fill="#6b7e8d"/></marker></defs><rect width="560" height="1357" fill="#ffffff"/><g font-family="Leelawadee UI, Noto Sans Thai, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="28" y="38" font-size="26" fill="#146c96" text-anchor="start" font-weight="400">STUDY  /  IOT 21</text><text x="28" y="90" font-size="38" fill="#172b3a" text-anchor="start" font-weight="700">GPIO ส่ง Logic</text><text x="28" y="138" font-size="38" fill="#172b3a" text-anchor="start" font-weight="700">ไม่ขับ Coil โดยตรง</text><rect x="28" y="206" width="504" height="76" rx="12" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280.0" y="249" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">GPIO26 • Logic3.3V</text><polyline points="280,287 280,306" fill="none" stroke="#146c96" stroke-width="3" marker-end="url(#arrow)"/><rect x="28" y="310" width="504" height="120" rx="12" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280.0" y="353" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">IN • Relay Module</text><text x="280.0" y="397" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">Driver + Coil อยู่ภายใน</text><rect x="28" y="458" width="504" height="120" rx="12" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280.0" y="501" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">VCC ตามสเปก module</text><text x="280.0" y="545" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">GND logic ร่วมกับ ESP32</text><text x="28" y="631" font-size="32" fill="#172b3a" text-anchor="start" font-weight="600">วงจรโหลด • OFF ที่ NO</text><polyline points="180,671 180,736" fill="none" stroke="#a53838" stroke-width="3" stroke-dasharray="8 6"/><text x="240" y="701" font-size="30" fill="#a53838" text-anchor="start" font-weight="400">LOAD+3.3V</text><circle cx="180" cy="736" r="5" fill="#146c96"/><text x="240" y="746" font-size="32" fill="#172b3a" text-anchor="start" font-weight="400">COM</text><polyline points="180,736 125,796" fill="none" stroke="#6b7e8d" stroke-width="4"/><circle cx="180" cy="836" r="5" fill="#146c96"/><text x="240" y="846" font-size="30" fill="#172b3a" text-anchor="start" font-weight="400">NO • ยังเปิดวงจร</text><polyline points="180,836 180,891" fill="none" stroke="#a53838" stroke-width="3" stroke-dasharray="8 6"/><rect x="115" y="891" width="130" height="65" rx="12" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="180" y="936" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">330Ω</text><polyline points="180,956 180,1001" fill="none" stroke="#a53838" stroke-width="3" stroke-dasharray="8 6"/><rect x="115" y="1001" width="130" height="65" rx="12" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="180" y="1046" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">LED</text><text x="275" y="1046" font-size="30" fill="#172b3a" text-anchor="start" font-weight="400">A → K</text><polyline points="180,1066 180,1116" fill="none" stroke="#6b7e8d" stroke-width="3"/><text x="240" y="1116" font-size="30" fill="#172b3a" text-anchor="start" font-weight="400">LOAD−</text><rect x="28" y="1161" width="504" height="120" rx="12" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280.0" y="1204" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">ห้ามต่อ Coil เปล่ากับ GPIO</text><text x="280.0" y="1248" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">ใช้เฉพาะโ