<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="2520" viewBox="0 0 560 1260" role="img" aria-labelledby="title desc" lang="th"><title id="title">น้ำสูงขึ้น ระยะที่วัดลดลง</title><desc id="desc">ตัวอย่างH100cmคงที่:วัดd60cmได้h40cm;วัดd20cmได้h80cm;ระยะsensorถึงน้ำลดลงเมื่อผิวน้ำสูงขึ้น</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9" fill="#6b7e8d"/></marker></defs><rect width="560" height="1260" fill="#ffffff"/><g font-family="Leelawadee UI, Noto Sans Thai, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="28" y="38" font-size="26" fill="#146c96" text-anchor="start" font-weight="400">STUDY  /  IOT 11</text><text x="28" y="90" font-size="38" fill="#172b3a" text-anchor="start" font-weight="700">น้ำสูงขึ้น</text><text x="28" y="138" font-size="38" fill="#172b3a" text-anchor="start" font-weight="700">ระยะที่วัดลดลง</text><rect x="28" y="206" width="504" height="76" rx="12" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280.0" y="249" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">d = 60cm → h = 40cm</text><rect x="100" y="360" width="360" height="240" rx="2" fill="#fff" stroke="#6b7e8d" stroke-width="2"/><rect x="102" y="504.0" width="356" height="96.0" rx="0" fill="#e4f4f3" stroke="#08776f" stroke-width="2"/><rect x="210" y="315" width="140" height="45" rx="12" fill="#e4eef5" stroke="#146c96" stroke-width="2"/><text x="280" y="348" font-size="28" fill="#172b3a" text-anchor="middle" font-weight="400">Sensor</text><polyline points="155,360 155,504.0" fill="none" stroke="#146c96" stroke-width="3"/><text x="175" y="444.0" font-size="30" fill="#146c96" text-anchor="start" font-weight="400">d=60</text><text x="280" y="585" font-size="30" fill="#08776f" text-anchor="middle" font-weight="400">h=40cm</text><rect x="28" y="635" width="504" height="76" rx="12" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280.0" y="678" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">d = 20cm → h = 80cm</text><rect x="100" y="789" width="360" height="240" rx="2" fill="#fff" stroke="#6b7e8d" stroke-width="2"/><rect x="102" y="837.0" width="356" height="192.0" rx="0" fill="#e4f4f3" stroke="#08776f" stroke-width="2"/><rect x="210" y="744" width="140" height="45" rx="12" fill="#e4eef5" stroke="#146c96" stroke-width="2"/><text x="280" y="777" font-size="28" fill="#172b3a" text-anchor="middle" font-weight="400">Sensor</text><polyline points="155,789 155,837.0" fill="none" stroke="#146c96" stroke-width="3"/><text x="175" y="825.0" font-size="30" fill="#146c96" text-anchor="start" font-weight="400">d=20</text><text x="280" y="1014" font-size="30" fill="#08776f" text-anchor="middle" font-weight="400">h=80cm</text><rect x="28" y="1064" width="504" height="120" rx="12" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280.0" y="1107" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">H = 100cm คงที่</text><text x="280.0" y="1151" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">h = H − d • ตัวอย่างสมมติ</text><text x="28" y="1236" font-size="26" fill="#526273" text-anchor="start" font-weight="400">ภาพเสริม • ตรวจรุ่นและวงจรจริงก่อนใช้</text></g></svg>
