<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1596" viewBox="0 0 560 798" role="img" aria-labelledby="title desc" lang="th"><title id="title">IoT มีชั้นใดบ้าง?</title><desc id="desc">ตัวอย่างชั้น Device, Network, Platform, Application; เส้นทางเครือข่ายแยกจาก local control ไม่ได้อ้างว่าสเก็ตช์นี้ติดตั้ง cloud แล้ว</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9" fill="#6b7e8d"/></marker></defs><rect width="560" height="798" fill="#ffffff"/><g font-family="Leelawadee UI, Noto Sans Thai, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="28" y="38" font-size="26" fill="#146c96" text-anchor="start" font-weight="400">STUDY  /  IOT 03</text><text x="28" y="90" font-size="38" fill="#172b3a" text-anchor="start" font-weight="700">IoT มีชั้นใดบ้าง?</text><rect x="28" y="158" width="504" height="120" rx="12" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280.0" y="201" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">Device • อุปกรณ์</text><text x="280.0" y="245" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">Sensor + Controller + Output</text><polyline points="280,283 280,302" fill="none" stroke="#146c96" stroke-width="3" marker-end="url(#arrow)"/><rect x="28" y="306" width="504" height="120" rx="12" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280.0" y="349" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">Network • เครือข่าย</text><text x="280.0" y="393" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">เส้นทางสื่อสารข้อมูล</text><polyline points="280,431 280,450" fill="none" stroke="#146c96" stroke-width="3" marker-end="url(#arrow)"/><rect x="28" y="454" width="504" height="120" rx="12" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280.0" y="497" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">Platform • จัดการข้อมูล</text><text x="280.0" y="541" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">ชั้นประมวลผล/จัดเก็บ</text><polyline points="280,579 280,598" fill="none" stroke="#146c96" stroke-width="3" marker-end="url(#arrow)"/><rect x="28" y="602" width="504" height="120" rx="12" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280.0" y="645" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">Application • การใช้งาน</text><text x="280.0" y="689" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">ผู้ใช้ดูข้อมูล/สั่งงาน</text><text x="28" y="774" font-size="26" fill="#526273" text-anchor="start" font-weight="400">ภาพเสริม • ตรวจรุ่นและวงจรจริงก่อนใช้</text></g></svg>
