<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="2042" viewBox="0 0 560 1021" role="img" aria-labelledby="title desc" lang="th"><title id="title">I2C แชร์สองเส้น แต่ต้องแยก Address</title><desc id="desc">GPIO21SDAและ22SCLแชร์ไปOLED0x3Cสมมติและอุปกรณ์อื่นถ้ามีที่อยู่ไม่ซ้ำ;เส้นทั้งสองต้องpullupไปlogicที่ทุกdeviceรับได้และGNDร่วม</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9" fill="#6b7e8d"/></marker></defs><rect width="560" height="1021" fill="#ffffff"/><g font-family="Leelawadee UI, Noto Sans Thai, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="28" y="38" font-size="26" fill="#146c96" text-anchor="start" font-weight="400">STUDY  /  IOT 17</text><text x="28" y="90" font-size="38" fill="#172b3a" text-anchor="start" font-weight="700">I2C แชร์สองเส้น</text><text x="28" y="138" font-size="38" fill="#172b3a" text-anchor="start" font-weight="700">แต่ต้องแยก Address</text><rect x="28" y="206" width="504" height="120" rx="12" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280.0" y="249" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">ESP32 ตัวอย่าง</text><text x="280.0" y="293" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">GPIO21 SDA / GPIO22 SCL</text><polyline points="180,326 180,384" fill="none" stroke="#08776f" stroke-width="3"/><circle cx="180" cy="384" r="5" fill="#08776f"/><polyline points="380,326 380,454" fill="none" stroke="#146c96" stroke-width="3"/><circle cx="380" cy="454" r="5" fill="#146c96"/><polyline points="45,384 515,384" fill="none" stroke="#08776f" stroke-width="4"/><polyline points="45,454 515,454" fill="none" stroke="#146c96" stroke-width="4"/><text x="45" y="366" font-size="30" fill="#08776f" text-anchor="start" font-weight="400">SDA</text><text x="445" y="441" font-size="30" fill="#146c96" text-anchor="start" font-weight="400">SCL</text><polyline points="100,384 100,529" fill="none" stroke="#08776f" stroke-width="3"/><circle cx="100" cy="384" r="5" fill="#08776f"/><polyline points="155,454 155,529" fill="none" stroke="#146c96" stroke-width="3"/><circle cx="155" cy="454" r="5" fill="#146c96"/><polyline points="370,384 370,529" fill="none" stroke="#08776f" stroke-width="3"/><circle cx="370" cy="384" r="5" fill="#08776f"/><polyline points="425,454 425,529" fill="none" stroke="#146c96" stroke-width="3"/><circle cx="425" cy="454" r="5" fill="#146c96"/><rect x="28" y="529" width="240" height="120" rx="12" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="148.0" y="572" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">OLED</text><text x="148.0" y="616" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">0x3C สมมติ</text><rect x="292" y="529" width="240" height="120" rx="12" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="412.0" y="572" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">Device อื่น</text><text x="412.0" y="616" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">addr ไม่ซ้ำ</text><rect x="28" y="677" width="504" height="120" rx="12" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280.0" y="720" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">SDA / SCL ต้องมี pull-up</text><text x="280.0" y="764" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">ไป3.3V ที่ทุกdeviceรับได้</text><rect x="28" y="825" width="504" height="120" rx="12" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280.0" y="868" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">GND ร่วม • ตรวจไฟ VCC</text><text x="280.0" y="912" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">จุดทึบ = ต่อถึงกัน</text><text x="28" y="997" font-size="26" fill="#526273" text-anchor="start" font-weight="400">ภาพเสริม • ตรวจรุ่นและวงจรจริงก่อนใช้</text></g></svg>
