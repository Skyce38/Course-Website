<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="2332" viewBox="0 0 560 1166" role="img" aria-labelledby="title desc" lang="th"><title id="title">อ่านบอร์ด ESP32 อย่าสับสน GPIO กับขาเสียบ</title><desc id="desc">ภาพเชิงหน้าที่ของ classic ESP32-WROOM: USB/วงจรไฟ โมดูล และกลุ่ม GPIO34 input-only, GPIO25/26/27 output, GPIO32/33 ตัวอย่าง ไม่ใช่ตำแหน่ง header จริง</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9" fill="#6b7e8d"/></marker></defs><rect width="560" height="1166" fill="#ffffff"/><g font-family="Leelawadee UI, Noto Sans Thai, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="28" y="38" font-size="26" fill="#146c96" text-anchor="start" font-weight="400">STUDY  /  IOT 01</text><text x="28" y="90" font-size="38" fill="#172b3a" text-anchor="start" font-weight="700">อ่านบอร์ด ESP32</text><text x="28" y="138" font-size="38" fill="#172b3a" text-anchor="start" font-weight="700">อย่าสับสน GPIO กับขาเสียบ</text><rect x="80" y="206" width="400" height="290" rx="12" fill="#eaf2f4" stroke="#08776f" stroke-width="2"/><rect x="130" y="241" width="300" height="125" rx="12" fill="#dfe7eb" stroke="#6b7e8d" stroke-width="2"/><text x="280" y="291" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="700">ESP32-WROOM</text><text x="280" y="338" font-size="30" fill="#526273" text-anchor="middle" font-weight="400">Module / SoC</text><rect x="205" y="421" width="150" height="55" rx="12" fill="#ffffff" stroke="#6b7e8d" stroke-width="2"/><text x="280" y="459" font-size="30" fill="#172b3a" text-anchor="middle" font-weight="400">USB / ไฟ</text><rect x="28" y="526" width="504" height="120" rx="12" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280.0" y="569" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">GPIO34 • Input / ADC</text><text x="280.0" y="613" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">ไม่มี internal pull-up/down</text><rect x="28" y="674" width="504" height="120" rx="12" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280.0" y="717" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">GPIO25 / 26 / 27</text><text x="280.0" y="761" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">ขา Output ในตัวอย่าง LED</text><rect x="28" y="822" width="504" height="120" rx="12" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280.0" y="865" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">GPIO32 / 33</text><text x="280.0" y="909" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">สัญญาณตัวอย่าง TRIG / ECHO</text><rect x="28" y="970" width="504" height="120" rx="12" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280.0" y="1013" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">ผังเชิงหน้าที่เท่านั้น</text><text x="280.0" y="1057" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">ไม่ระบุตำแหน่ง header จริง</text><text x="28" y="1142" font-size="26" fill="#526273" text-anchor="start" font-weight="400">ภาพเสริม • ตรวจรุ่นและวงจรจริงก่อนใช้</text></g></svg>
