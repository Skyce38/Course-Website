<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1396" viewBox="0 0 560 698" role="img" aria-labelledby="title desc" lang="th"><title id="title">Echo500µs ได้ระยะเท่าใด?</title><desc id="desc">ที่v343m/s แปลงเป็น0.0343cm/µs;500คูณ0.0343ได้17.15cmไปกลับ;หาร2ได้8.575cmถึงวัตถุ</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9" fill="#6b7e8d"/></marker></defs><rect width="560" height="698" fill="#ffffff"/><g font-family="Leelawadee UI, Noto Sans Thai, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="28" y="38" font-size="26" fill="#146c96" text-anchor="start" font-weight="400">STUDY  /  IOT 09</text><text x="28" y="90" font-size="38" fill="#172b3a" text-anchor="start" font-weight="700">Echo500µs</text><text x="28" y="138" font-size="38" fill="#172b3a" text-anchor="start" font-weight="700">ได้ระยะเท่าใด?</text><rect x="28" y="206" width="504" height="120" rx="12" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280.0" y="249" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">1 • แปลงหน่วยความเร็ว</text><text x="280.0" y="293" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">343m/s = 0.0343cm/µs</text><polyline points="280,331 280,350" fill="none" stroke="#146c96" stroke-width="3" marker-end="url(#arrow)"/><rect x="28" y="354" width="504" height="120" rx="12" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280.0" y="397" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">2 • คิดระยะไปกลับ</text><text x="280.0" y="441" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">500 × 0.0343 = 17.15cm</text><polyline points="280,479 280,498" fill="none" stroke="#146c96" stroke-width="3" marker-end="url(#arrow)"/><rect x="28" y="502" width="504" height="120" rx="12" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280.0" y="545" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">3 • ระยะถึงวัตถุ</text><text x="280.0" y="589" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">17.15 / 2 = 8.575cm</text><text x="28" y="674" font-size="26" fill="#526273" text-anchor="start" font-weight="400">ภาพเสริม • ตรวจรุ่นและวงจรจริงก่อนใช้</text></g></svg>
