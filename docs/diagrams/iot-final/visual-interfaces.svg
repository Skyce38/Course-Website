<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1892" viewBox="0 0 560 946" role="img" aria-labelledby="title desc" lang="th"><title id="title">เลือกจากชนิดสัญญาณ</title><desc id="desc">GPIOอ่านlogic,ADCอ่านanalog,UARTใช้TXRX asynchronous,SPIใช้clock/data/select,I2Cแชร์SDA/SCLพร้อมaddress;ไม่เหมารวมsensorจากรูปลักษณ์</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9" fill="#6b7e8d"/></marker></defs><rect width="560" height="946" fill="#ffffff"/><g font-family="Leelawadee UI, Noto Sans Thai, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="28" y="38" font-size="26" fill="#146c96" text-anchor="start" font-weight="400">STUDY  /  IOT 16</text><text x="28" y="90" font-size="38" fill="#172b3a" text-anchor="start" font-weight="700">เลือกจากชนิดสัญญาณ</text><rect x="28" y="158" width="504" height="120" rx="12" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280.0" y="201" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">GPIO • LOW / HIGH</text><text x="280.0" y="245" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">อ่านหรือขับระดับ logic</text><rect x="28" y="306" width="504" height="120" rx="12" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280.0" y="349" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">ADC • Analog → จำนวนเต็ม</text><text x="280.0" y="393" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">ไม่ใช่ protocol ระหว่าง device</text><rect x="28" y="454" width="504" height="120" rx="12" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280.0" y="497" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">UART • TX / RX</text><text x="280.0" y="541" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">ไม่มี clock ร่วมในแบบนี้</text><rect x="28" y="602" width="504" height="120" rx="12" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280.0" y="645" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">SPI • Clock / Data / CS</text><text x="280.0" y="689" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">เลือก device ด้วย CS</text><rect x="28" y="750" width="504" height="120" rx="12" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280.0" y="793" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">I2C • SDA / SCL</text><text x="280.0" y="837" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">แชร์ bus • แยกด้วย address</text><text x="28" y="922" font-size="26" fill="#526273" text-anchor="start" font-weight="400">ภาพเสริม • ตรวจรุ่นและวงจรจริงก่อนใช้</text></g></svg>
