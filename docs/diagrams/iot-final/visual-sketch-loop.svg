<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1508" viewBox="0 0 560 754" role="img" aria-labelledby="title desc" lang="th"><title id="title">โปรแกรมเริ่มอย่างไร?</title><desc id="desc">Boot/resetแล้วsetupหนึ่งครั้งก่อนloopซ้ำ;resetเริ่มsetupใหม่;ไม่อ้างว่ามีความถี่loopคงที่</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9" fill="#6b7e8d"/></marker></defs><rect width="560" height="754" fill="#ffffff"/><g font-family="Leelawadee UI, Noto Sans Thai, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="28" y="38" font-size="26" fill="#146c96" text-anchor="start" font-weight="400">STUDY  /  IOT 13</text><text x="28" y="90" font-size="38" fill="#172b3a" text-anchor="start" font-weight="700">โปรแกรมเริ่มอย่างไร?</text><rect x="28" y="158" width="504" height="76" rx="12" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280.0" y="201" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">Boot / Reset</text><polyline points="280,239 280,258" fill="none" stroke="#146c96" stroke-width="3" marker-end="url(#arrow)"/><rect x="28" y="262" width="504" height="120" rx="12" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280.0" y="305" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">setup() • ตั้งค่า</text><text x="280.0" y="349" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">หนึ่งครั้งก่อน loop</text><polyline points="280,387 280,406" fill="none" stroke="#146c96" stroke-width="3" marker-end="url(#arrow)"/><rect x="28" y="410" width="504" height="120" rx="12" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280.0" y="453" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">loop() • อ่าน/ตัดสินใจ</text><text x="280.0" y="497" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">คืนการทำงานแล้วเรียกซ้ำ</text><polyline points="532,510 546,510 546,430 532,430" fill="none" stroke="#146c96" stroke-width="3" marker-end="url(#arrow)"/><rect x="28" y="558" width="504" height="120" rx="12" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280.0" y="601" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">Reset → เริ่ม setup() ใหม่</text><text x="280.0" y="645" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">เวลารอบขึ้นกับคำสั่ง</text><text x="28" y="730" font-size="26" fill="#526273" text-anchor="start" font-weight="400">ภาพเสริม • ตรวจรุ่นและวงจรจริงก่อนใช้</text></g></svg>
