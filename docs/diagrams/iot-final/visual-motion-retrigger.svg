<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="2272" viewBox="0 0 560 1136" role="img" aria-labelledby="title desc" lang="th"><title id="title">HIGH ใหม่ เริ่มนับจากครั้งล่าสุด</title><desc id="desc">HIGHที่1000และ9000msทำให้lastSeen9000 เดิมจะครบ11000แต่ถูกแทนด้วย19000;LOW11000ยังONและLOW19000OFF;HIGHที่deadlineมีสิทธิก่อนtimeoutตามcode</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9" fill="#6b7e8d"/></marker></defs><rect width="560" height="1136" fill="#ffffff"/><g font-family="Leelawadee UI, Noto Sans Thai, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="28" y="38" font-size="26" fill="#146c96" text-anchor="start" font-weight="400">STUDY  /  IOT 23</text><text x="28" y="90" font-size="38" fill="#172b3a" text-anchor="start" font-weight="700">HIGH ใหม่</text><text x="28" y="138" font-size="38" fill="#172b3a" text-anchor="start" font-weight="700">เริ่มนับจากครั้งล่าสุด</text><text x="28" y="226" font-size="32" fill="#172b3a" text-anchor="start" font-weight="400">ON ตั้งแต่1s ถึง19s</text><rect x="73" y="291" width="414" height="55" rx="3" fill="#e4eef5" stroke="#146c96" stroke-width="2"/><polyline points="303,271 303,371" fill="none" stroke="#6b7e8d" stroke-width="3" stroke-dasharray="8 6"/><text x="50" y="416" font-size="30" fill="#526273" text-anchor="middle" font-weight="400">0</text><text x="257" y="416" font-size="30" fill="#526273" text-anchor="middle" font-weight="400">9</text><text x="487" y="416" font-size="30" fill="#526273" text-anchor="middle" font-weight="400">19</text><text x="280" y="461" font-size="30" fill="#526273" text-anchor="middle" font-weight="400">เวลา (s) • ไม่มี HIGH เพิ่ม</text><rect x="28" y="496" width="504" height="120" rx="12" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280.0" y="539" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">1,000ms HIGH</text><text x="280.0" y="583" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">ON • เดิมครบที่11,000</text><polyline points="280,621 280,640" fill="none" stroke="#146c96" stroke-width="3" marker-end="url(#arrow)"/><rect x="28" y="644" width="504" height="120" rx="12" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280.0" y="687" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">9,000ms HIGH ใหม่</text><text x="280.0" y="731" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">lastSeen = 9,000</text><polyline points="280,769 280,788" fill="none" stroke="#146c96" stroke-width="3" marker-end="url(#arrow)"/><rect x="28" y="792" width="504" height="120" rx="12" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280.0" y="835" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">11,000ms LOW</text><text x="280.0" y="879" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">ยัง ON • เพิ่งผ่าน2,000ms</text><polyline points="280,917 280,936" fill="none" stroke="#146c96" stroke-width="3" marker-end="url(#arrow)"/><rect x="28" y="940" width="504" height="120" rx="12" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280.0" y="983" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">19,000ms LOW</text><text x="280.0" y="1027" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">OFF • ครบ10,000ms ล่าสุด</text><text x="28" y="1112" font-size="26" fill="#526273" text-anchor="start" font-weight="400">ภาพเสริม • ตรวจรุ่นและวงจรจริงก่อนใช้</text></g></svg>
