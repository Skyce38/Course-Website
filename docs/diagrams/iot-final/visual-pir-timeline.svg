<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1782" viewBox="0 0 560 891" role="img" aria-labelledby="title desc" lang="th"><title id="title">HIGH / LOW คือสถานะที่สังเกตได้</title><desc id="desc">PIRตัวอย่างactiveHIGHให้HIGHในช่วงสมมติ2–5และ9–11วินาที;hold/retriggerของmoduleมีผล ไม่ใช่เวลาการเคลื่อนของคนที่ยืนยันแล้ว</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9" fill="#6b7e8d"/></marker></defs><rect width="560" height="891" fill="#ffffff"/><g font-family="Leelawadee UI, Noto Sans Thai, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="28" y="38" font-size="26" fill="#146c96" text-anchor="start" font-weight="400">STUDY  /  IOT 20</text><text x="28" y="90" font-size="38" fill="#172b3a" text-anchor="start" font-weight="700">HIGH / LOW</text><text x="28" y="138" font-size="38" fill="#172b3a" text-anchor="start" font-weight="700">คือสถานะที่สังเกตได้</text><text x="28" y="226" font-size="32" fill="#172b3a" text-anchor="start" font-weight="400">DO • สมมติ active-HIGH</text><polyline points="45,456 520,456" fill="none" stroke="#6b7e8d" stroke-width="3"/><polyline points="50,416 122,416 122,286 230,286 230,416 374,416 374,286 446,286 446,416 518,416" fill="none" stroke="#146c96" stroke-width="4"/><text x="50" y="501" font-size="28" fill="#526273" text-anchor="middle" font-weight="400">0</text><text x="122" y="501" font-size="28" fill="#526273" text-anchor="middle" font-weight="400">2</text><text x="230" y="501" font-size="28" fill="#526273" text-anchor="middle" font-weight="400">5</text><text x="374" y="501" font-size="28" fill="#526273" text-anchor="middle" font-weight="400">9</text><text x="446" y="501" font-size="28" fill="#526273" text-anchor="middle" font-weight="400">11</text><text x="518" y="501" font-size="28" fill="#526273" text-anchor="middle" font-weight="400">13</text><text x="280" y="546" font-size="30" fill="#526273" text-anchor="middle" font-weight="400">เวลา (s) • ช่วงสมมติ</text><rect x="28" y="591" width="504" height="76" rx="12" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280.0" y="634" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">HIGH → observed motion</text><polyline points="280,672 280,691" fill="none" stroke="#146c96" stroke-width="3" marker-end="url(#arrow)"/><rect x="28" y="695" width="504" height="120" rx="12" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280.0" y="738" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">LOW → No Motion</text><text x="280.0" y="782" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">ไม่ใช่หลักฐานว่าห้องว่าง</text><text x="28" y="867" font-size="26" fill="#526273" text-anchor="start" font-weight="400">ภาพเสริม • ตรวจรุ่นและวงจรจริงก่อนใช้</text></g></svg>
