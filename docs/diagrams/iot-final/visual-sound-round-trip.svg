<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1756" viewBox="0 0 560 878" role="img" aria-labelledby="title desc" lang="th"><title id="title">ทำไมต้องหาร2?</title><desc id="desc">คลื่นเสียงเดินทางจากSensorถึงผิวสะท้อนระยะdแล้วกลับอีกd รวม2d;เวลาEchoเป็นเวลาไปกลับ</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9" fill="#6b7e8d"/></marker></defs><rect width="560" height="878" fill="#ffffff"/><g font-family="Leelawadee UI, Noto Sans Thai, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="28" y="38" font-size="26" fill="#146c96" text-anchor="start" font-weight="400">STUDY  /  IOT 08</text><text x="28" y="90" font-size="38" fill="#172b3a" text-anchor="start" font-weight="700">ทำไมต้องหาร2?</text><rect x="28" y="158" width="504" height="76" rx="12" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280.0" y="201" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">Sensor • ส่งและรับ</text><polyline points="180,262 180,502" fill="none" stroke="#146c96" stroke-width="4" marker-end="url(#arrow)"/><polyline points="380,502 380,262" fill="none" stroke="#08776f" stroke-width="4" marker-end="url(#arrow)"/><text x="150" y="372" font-size="32" fill="#146c96" text-anchor="end" font-weight="400">ไป d</text><text x="410" y="437" font-size="32" fill="#08776f" text-anchor="start" font-weight="400">กลับ d</text><polyline points="65,532 495,532" fill="none" stroke="#6b7e8d" stroke-width="5"/><text x="280" y="582" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">ผิวสะท้อน</text><rect x="28" y="622" width="504" height="76" rx="12" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280.0" y="665" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">ระยะเดินทางรวม = 2d</text><polyline points="280,703 280,722" fill="none" stroke="#146c96" stroke-width="3" marker-end="url(#arrow)"/><rect x="28" y="726" width="504" height="76" rx="12" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280.0" y="769" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">ระยะถึงผิว = v × t / 2</text><text x="28" y="854" font-size="26" fill="#526273" text-anchor="start" font-weight="400">ภาพเสริม • ตรวจรุ่นและวงจรจริงก่อนใช้</text></g></svg>
