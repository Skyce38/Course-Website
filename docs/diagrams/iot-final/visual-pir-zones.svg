<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1806" viewBox="0 0 560 903" role="img" aria-labelledby="title desc" lang="th"><title id="title">PIR รับการเปลี่ยนแปลง IR</title><desc id="desc">แนวรับเชิงแนวคิดหลายโซนจากFresnellens ผู้เคลื่อนผ่านโซนทำให้IRที่รับเปลี่ยน ไม่ใช่ลำแสงที่PIRยิงออก และไม่รับรองpresenceเมื่ออยู่นิ่ง</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9" fill="#6b7e8d"/></marker></defs><rect width="560" height="903" fill="#ffffff"/><g font-family="Leelawadee UI, Noto Sans Thai, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="28" y="38" font-size="26" fill="#146c96" text-anchor="start" font-weight="400">STUDY  /  IOT 19</text><text x="28" y="90" font-size="38" fill="#172b3a" text-anchor="start" font-weight="700">PIR รับการเปลี่ยนแปลง IR</text><path d="M280 403L10 173L70 173Z" fill="#e4f4f3" stroke="#bfd8d5" stroke-width="2"/><path d="M280 403L130 173L190 173Z" fill="#e4f4f3" stroke="#bfd8d5" stroke-width="2"/><path d="M280 403L250 173L310 173Z" fill="#e4f4f3" stroke="#bfd8d5" stroke-width="2"/><path d="M280 403L370 173L430 173Z" fill="#e4f4f3" stroke="#bfd8d5" stroke-width="2"/><path d="M280 403L490 173L550 173Z" fill="#e4f4f3" stroke="#bfd8d5" stroke-width="2"/><polyline points="65,223 495,223" fill="none" stroke="#146c96" stroke-width="4" marker-end="url(#arrow)"/><text x="280" y="153" font-size="32" fill="#146c96" text-anchor="middle" font-weight="400">เคลื่อนผ่านโซนรับ</text><rect x="205" y="403" width="150" height="100" rx="12" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="448" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="700">PIR</text><text x="280" y="488" font-size="30" fill="#172b3a" text-anchor="middle" font-weight="400">Lens</text><rect x="28" y="543" width="504" height="76" rx="12" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280.0" y="586" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">รับการเปลี่ยนแปลง IR</text><rect x="28" y="647" width="504" height="76" rx="12" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280.0" y="690" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">ไม่ส่ง ultrasound ออกไป</text><rect x="28" y="751" width="504" height="76" rx="12" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280.0" y="794" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">อยู่นิ่ง ≠ รับรองว่าไม่มีคน</text><text x="28" y="879" font-size="26" fill="#526273" text-anchor="start" font-weight="400">ภาพเสริม • ตรวจรุ่นและวงจรจริงก่อนใช้</text></g></svg>
