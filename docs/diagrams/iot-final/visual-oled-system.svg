<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="2164" viewBox="0 0 560 1082" role="img" aria-labelledby="title desc" lang="th"><title id="title">ระบบเดียว แยกสามเส้นทางสัญญาณ</title><desc id="desc">ESP32ตัวเดียวรับPIRDOผ่านGPIO33 คุมrelayIN26 และคุยOLEDด้วยGPIO21SDA22SCL,address0x3Cสมมติ ตรวจไฟแต่ละmoduleและGNDร่วม ไม่มีcoilตรงGPIO</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9" fill="#6b7e8d"/></marker></defs><rect width="560" height="1082" fill="#ffffff"/><g font-family="Leelawadee UI, Noto Sans Thai, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="28" y="38" font-size="26" fill="#146c96" text-anchor="start" font-weight="400">STUDY  /  IOT 24</text><text x="28" y="90" font-size="38" fill="#172b3a" text-anchor="start" font-weight="700">ระบบเดียว</text><text x="28" y="138" font-size="38" fill="#172b3a" text-anchor="start" font-weight="700">แยกสามเส้นทางสัญญาณ</text><rect x="28" y="206" width="504" height="120" rx="12" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280.0" y="249" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">PIR DO → GPIO33</text><text x="280.0" y="293" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">active-HIGH สมมติ</text><polyline points="280,331 280,350" fill="none" stroke="#146c96" stroke-width="3" marker-end="url(#arrow)"/><rect x="28" y="354" width="504" height="120" rx="12" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280.0" y="397" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">ESP32 • อ่านและตัดสินใจ</text><text x="280.0" y="441" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">Controller เพียงตัวเดียว</text><polyline points="148,474 148,502" fill="none" stroke="#146c96" stroke-width="3" marker-end="url(#arrow)"/><polyline points="412,474 412,502" fill="none" stroke="#08776f" stroke-width="3" marker-end="url(#arrow)"/><rect x="28" y="502" width="240" height="164" rx="12" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="148.0" y="545" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">GPIO26</text><text x="148.0" y="589" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">Relay IN</text><text x="148.0" y="633" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">active-LOW</text><rect x="292" y="502" width="240" height="164" rx="12" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="412.0" y="545" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">GPIO21/22</text><text x="412.0" y="589" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">SDA / SCL</text><text x="412.0" y="633" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">OLED0x3C*</text><polyline points="148,666 148,694" fill="none" stroke="#146c96" stroke-width="3" marker-end="url(#arrow)"/><rect x="28" y="694" width="240" height="120" rx="12" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="148.0" y="737" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">COM / NO</text><text x="148.0" y="781" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">LED แรงดันต่ำ</text><rect x="28" y="842" width="504" height="164" rx="12" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280.0" y="885" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">*Address สมมติ • ตรวจ ACK</text><text x="280.0" y="929" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">VCC ตามสเปกแต่ละ module</text><text x="280.0" y="973" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">GND ร่วม / pull-ups3.3V</text><text x="28" y="1058" font-size="26" fill="#526273" text-anchor="start" font-weight="400">ภาพเสริม • ตรวจรุ่นและวงจรจริงก่อนใช้</text></g></svg>
