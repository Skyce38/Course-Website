<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1638" viewBox="0 0 560 819" role="img" aria-labelledby="title desc" lang="th"><title id="title">Trigger ไม่ใช่ Echo</title><desc id="desc">TriggerHIGHอย่างน้อย10µsเป็นคำสั่งเริ่มวัด;EchoHIGH500µsเป็นตัวอย่างเวลาที่นำไปคิดระยะ;สองแถววาดคนละสเกลไม่อ้าง internal delay</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9" fill="#6b7e8d"/></marker></defs><rect width="560" height="819" fill="#ffffff"/><g font-family="Leelawadee UI, Noto Sans Thai, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="28" y="38" font-size="26" fill="#146c96" text-anchor="start" font-weight="400">STUDY  /  IOT 07</text><text x="28" y="90" font-size="38" fill="#172b3a" text-anchor="start" font-weight="700">Trigger ไม่ใช่ Echo</text><text x="28" y="168" font-size="32" fill="#172b3a" text-anchor="start" font-weight="600">TRIG • เริ่มวัด</text><polyline points="40,308 120,308 120,223 220,223 220,308 520,308" fill="none" stroke="#146c96" stroke-width="4"/><text x="170" y="270" font-size="32" fill="#146c96" text-anchor="middle" font-weight="400">≥10µs</text><text x="28" y="418" font-size="32" fill="#172b3a" text-anchor="start" font-weight="600">ECHO • เวลาที่วัด</text><polyline points="40,578 160,578 160,488 480,488 480,578 520,578" fill="none" stroke="#146c96" stroke-width="4"/><text x="320" y="468" font-size="32" fill="#08776f" text-anchor="middle" font-weight="400">500µs ตัวอย่าง</text><rect x="28" y="623" width="504" height="120" rx="12" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280.0" y="666" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">ใช้ Echo ใน d = v × t / 2</text><text x="280.0" y="710" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">ไม่ระบุ delay ภายใน module</text><text x="28" y="795" font-size="26" fill="#526273" text-anchor="start" font-weight="400">ภาพเสริม • ตรวจรุ่นและวงจรจริงก่อนใช้</text></g></svg>
