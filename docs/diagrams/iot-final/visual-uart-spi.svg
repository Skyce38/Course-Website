<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="2720" viewBox="0 0 560 1360" role="img" aria-labelledby="title desc" lang="th"><title id="title">UART กับ SPI อย่าต่อจากชื่อที่คล้ายกัน</title><desc id="desc">UARTTX17ต่อRXอีกฝั่งและRX16ต่อTXอีกฝั่ง;SPI18SCLK23MOSI19MISO27CSตามตัวอย่างclassicESP32 ไม่ใช่ตำแหน่งheader</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9" fill="#6b7e8d"/></marker></defs><rect width="560" height="1360" fill="#ffffff"/><g font-family="Leelawadee UI, Noto Sans Thai, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="28" y="38" font-size="26" fill="#146c96" text-anchor="start" font-weight="400">STUDY  /  IOT 18</text><text x="28" y="90" font-size="38" fill="#172b3a" text-anchor="start" font-weight="700">UART กับ SPI</text><text x="28" y="138" font-size="38" fill="#172b3a" text-anchor="start" font-weight="700">อย่าต่อจากชื่อที่คล้ายกัน</text><rect x="28" y="206" width="504" height="76" rx="12" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280.0" y="249" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">UART • 9600 / 8N1 ตัวอย่าง</text><rect x="28" y="310" width="218" height="100" rx="12" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><rect x="314" y="310" width="218" height="100" rx="12" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="137" y="349" font-size="30" fill="#172b3a" text-anchor="middle" font-weight="400">GPIO17 TX</text><text x="423" y="349" font-size="30" fill="#172b3a" text-anchor="middle" font-weight="400">Device RX</text><polyline points="246,362 314,362" fill="none" stroke="#146c96" stroke-width="3" marker-end="url(#arrow)"/><rect x="28" y="435" width="218" height="100" rx="12" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><rect x="314" y="435" width="218" height="100" rx="12" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="137" y="474" font-size="30" fill