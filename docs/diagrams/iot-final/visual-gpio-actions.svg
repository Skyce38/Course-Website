<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1596" viewBox="0 0 560 798" role="img" aria-labelledby="title desc" lang="th"><title id="title">ตั้งโหมด อ่าน และเขียน</title><desc id="desc">pinModeกำหนดmode;digitalReadรับlogic;digitalWriteส่งlogicเมื่อเป็นOUTPUT;HIGHไม่ได้หมายถึงONทุกmodule</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9" fill="#6b7e8d"/></marker></defs><rect width="560" height="798" fill="#ffffff"/><g font-family="Leelawadee UI, Noto Sans Thai, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="28" y="38" font-size="26" fill="#146c96" text-anchor="start" font-weight="400">STUDY  /  IOT 14</text><text x="28" y="90" font-size="38" fill="#172b3a" text-anchor="start" font-weight="700">ตั้งโหมด อ่าน และเขียน</text><rect x="28" y="158" width="504" height="120" rx="12" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280.0" y="201" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">pinMode(pin, INPUT)</text><text x="280.0" y="245" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">กำหนดให้รับสัญญาณ</text><rect x="28" y="306" width="504" height="120" rx="12" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280.0" y="349" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">digitalRead(pin)</text><text x="280.0" y="393" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">อ่านค่า LOW / HIGH</text><rect x="28" y="454" width="504" height="120" rx="12" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280.0" y="497" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">pinMode(pin, OUTPUT)</text><text x="280.0" y="541" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">เลือกขาที่ขับได้</text><rect x="28" y="602" width="504" height="120" rx="12" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280.0" y="645" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">digitalWrite(pin, level)</text><text x="280.0" y="689" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">ส่ง logic • ไม่ใช่ driver กำลัง</text><text x="28" y="774" font-size="26" fill="#526273" text-anchor="start" font-weight="400">ภาพเสริม • ตรวจรุ่นและวงจรจริงก่อนใช้</text></g></svg>
