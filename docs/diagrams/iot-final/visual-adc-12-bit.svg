<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1692" viewBox="0 0 560 846" role="img" aria-labelledby="title desc" lang="th"><title id="title">ADC 12-bit 4096 รหัส ไม่ใช่4096สูงสุด</title><desc id="desc">ตั้ง analogReadResolution12 ทำให้ raw code0ถึง4095 รวม4096ค่า แรงดันกับcalibratedmillivoltsไม่ใช่rawโดยตรง</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9" fill="#6b7e8d"/></marker></defs><rect width="560" height="846" fill="#ffffff"/><g font-family="Leelawadee UI, Noto Sans Thai, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="28" y="38" font-size="26" fill="#146c96" text-anchor="start" font-weight="400">STUDY  /  IOT 06</text><text x="28" y="90" font-size="38" fill="#172b3a" text-anchor="start" font-weight="700">ADC 12-bit</text><text x="28" y="138" font-size="38" fill="#172b3a" text-anchor="start" font-weight="700">4096 รหัส ไม่ใช่4096สูงสุด</text><rect x="28" y="206" width="504" height="120" rx="12" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280.0" y="249" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">แรงดัน Analog</text><text x="280.0" y="293" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">ตรวจช่วง / attenuation</text><polyline points="280,331 280,350" fill="none" stroke="#146c96" stroke-width="3" marker-end="url(#arrow)"/><rect x="28" y="354" width="504" height="120" rx="12" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280.0" y="397" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">ตั้ง Resolution = 12</text><text x="280.0" y="441" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">analogReadResolution(12)</text><polyline points="280,479 280,498" fill="none" stroke="#146c96" stroke-width="3" marker-end="url(#arrow)"/><rect x="28" y="502" width="504" height="120" rx="12" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280.0" y="545" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">2¹² = 4096 รหัส</text><text x="280.0" y="589" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">ช่วง Raw: 0 … 4095</text><polyline points="280,627 280,646" fill="none" stroke="#146c96" stroke-width="3" marker-end="url(#arrow)"/><rect x="28" y="650" width="504" height="120" rx="12" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280.0" y="693" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">Raw ≠ calibrated mV</text><text x="280.0" y="737" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">ความละเอียด ≠ ความแม่นยำ</text><text x="28" y="822" font-size="26" fill="#526273" text-anchor="start" font-weight="400">ภาพเสริม • ตรวจรุ่นและวงจรจริงก่อนใช้</text></g></svg>
