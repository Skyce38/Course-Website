<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1946" viewBox="0 0 560 973" role="img" aria-labelledby="title desc" lang="th"><title id="title">ไม่มี HIGH ใหม่ครบ10s จึงปิด Lamp</title><desc id="desc">กรณีHIGHsampleที่1000msแล้วไม่มีHIGHใหม่:ตอน10999ยังON ตอน11000OFF;เริ่มOFF;เวลาคิดจากobservedHIGHล่าสุด ไม่ใช่การวัดคนหยุดจริง</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9" fill="#6b7e8d"/></marker></defs><rect width="560" height="973" fill="#ffffff"/><g font-family="Leelawadee UI, Noto Sans Thai, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="28" y="38" font-size="26" fill="#146c96" text-anchor="start" font-weight="400">STUDY  /  IOT 22</text><text x="28" y="90" font-size="38" fill="#172b3a" text-anchor="start" font-weight="700">ไม่มี HIGH ใหม่ครบ10s</text><text x="28" y="138" font-size="38" fill="#172b3a" text-anchor="start" font-weight="700">จึงปิด Lamp</text><text x="28" y="231" font-size="32" fill="#172b3a" text-anchor="start" font-weight="600">Lamp • ช่วง ON</text><polyline points="60,306 502,306" fill="none" stroke="#6b7e8d" stroke-width="3"/><rect x="94" y="276" width="340" height="60" rx="3" fill="#e4f4f3" stroke="#08776f" stroke-width="2"/><text x="264.0" y="318" font-size="32" fill="#08776f" text-anchor="middle" font-weight="400">10 วินาที</text><text x="60" y="391" font-size="30" fill="#526273" text-anchor="middle" font-weight="400">0</text><text x="94" y="391" font-size="30" fill="#526273" text-anchor="middle" font-weight="400">1</text><text x="434" y="391" font-size="30" fill="#526273" text-anchor="middle" font-weight="400">11</text><text x="502" y="391" font-size="30" fill="#526273" text-anchor="middle" font-weight="400">13</text><text x="280" y="441" font-size="30" fill="#526273" text-anchor="middle" font-weight="400">เวลา (s)</text><rect x="28" y="481" width="504" height="120" rx="12" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280.0" y="524" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">1,000ms • HIGH → ON</text><text x="280.0" y="568" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">lastSeen = 1,000</text><polyline points="280,606 280,625" fill="none" stroke="#146c96" stroke-width="3" marker-end="url(#arrow)"/><rect x="28" y="629" width="504" height="120" rx="12" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280.0" y="672" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">10,999ms • LOW → ยัง ON</text><text x="280.0" y="716" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">elapsed = 9,999</text><polyline points="280,754 280,773" fill="none" stroke="#146c96" stroke-width="3" marker-end="url(#arrow)"/><rect x="28" y="777" width="504" height="120" rx="12" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280.0" y="820" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">11,000ms • LOW → OFF</text><text x="280.0" y="864" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">elapsed = 10,000</text><text x="28" y="949" font-size="26" fill="#526273" text-anchor="start" font-weight="400">ภาพเสริม • ตรวจรุ่นและวงจรจริงก่อนใช้</text></g></svg>
