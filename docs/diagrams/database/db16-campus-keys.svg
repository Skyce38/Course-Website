<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="2132" viewBox="0 0 560 1066" role="img" aria-labelledby="title desc" lang="th"><title id="title">Campus Delivery ไล่คีย์ให้ตรงความหมาย</title><desc id="desc">students มี8 records; orders10อ้าง student_id; order_items14อ้าง order_id และ restaurant_id; restaurants6 ไม่เชื่อม student_id กับ order_id แม้เป็นเลขทั้งคู่</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9" fill="#6b7e8d"/></marker><marker id="inherit" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0 0L11 6L0 12Z" fill="#fff" stroke="#6b7e8d" stroke-width="1"/></marker><marker id="aggregation" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 0L12 6L6 12Z" fill="#fff" stroke="#6b7e8d" stroke-width="1"/></marker><marker id="composition" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 0L12 6L6 12Z" fill="#6b7e8d" stroke="#6b7e8d" stroke-width="1"/></marker></defs><rect width="560" height="1066" fill="#fff"/><g font-family="Leelawadee UI, Noto Sans Thai, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="28" y="38" font-size="26" fill="#146c96" text-anchor="start" font-weight="400">STUDY / DB • ภาพ 03</text><text x="28" y="90" font-size="36" fill="#172b3a" text-anchor="start" font-weight="700">Campus Delivery</text><text x="28" y="138" font-size="36" fill="#172b3a" text-anchor="start" font-weight="700">ไล่คีย์ให้ตรงความหมาย</text><g><rect x="28" y="216" width="504" height="112" rx="10" fill="#ffffff" stroke="#146c96" stroke-width="2"/><text x="280.0" y="260" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">students [8]</text><text x="280.0" y="304" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">PK student_id</text></g><text x="280" y="378" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">1 : N</text><polyline points="280,388 280,421" fill="none" stroke="#146c96" stroke-width="3" marker-end="url(#arrow)"/><g><rect x="28" y="434" width="504" height="112" rx="10" fill="#ffffff" stroke="#146c96" stroke-width="2"/><text x="280.0" y="478" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">orders [10]</text><text x="280.0" y="522" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">FK student_id → students</text></g><text x="280" y="596" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">1 : N</text><polyline points="280,606 280,639" fill="none" stroke="#146c96" stroke-width="3" marker-end="url(#arrow)"/><g><rect x="28" y="652" width="504" height="112" rx="10" fill="#ffffff" stroke="#146c96" stroke-width="2"/><text x="280.0" y="696" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">order_items [14]</text><text x="280.0" y="740" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">FK order_id → orders</text></g><text x="280" y="814" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">N : 1</text><polyline points="280,824 280,857" fill="none" stroke="#146c96" stroke-width="3" marker-end="url(#arrow)"/><g><rect x="28" y="870" width="504" height="112" rx="10" fill="#ffffff" stroke="#146c96" stroke-width="2"/><text x="280.0" y="914" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">restaurants [6]</text><text x="280.0" y="958" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">items.restaurant_id → ร้าน</text></g><text x="28" y="1041" font-size="24" fill="#526273" text-anchor="start" font-weight="400">ภาพอธิบายเสริม • ดูเงื่อนไขในคำบรรยาย</text></g></svg>
