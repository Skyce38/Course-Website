<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1868" viewBox="0 0 560 934" role="img" aria-labelledby="title desc" lang="th"><title id="title">หนึ่ง Profile มีหลาย Skills</title><desc id="desc">profile.id เป็น PK และ skill.profile_id เป็น FK หลาย skills จึงอ้าง profile เดียวได้ Users ที่เพิ่มภายหลังเชื่อม profile ผ่าน UNIQUE FK ไม่ใช่คอลัมน์ใน minimal slide schema</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9" fill="#6b7e8d"/></marker><marker id="inherit" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0 0L11 6L0 12Z" fill="#fff" stroke="#6b7e8d" stroke-width="1"/></marker><marker id="aggregation" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 0L12 6L6 12Z" fill="#fff" stroke="#6b7e8d" stroke-width="1"/></marker><marker id="composition" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 0L12 6L6 12Z" fill="#6b7e8d" stroke="#6b7e8d" stroke-width="1"/></marker></defs><rect width="560" height="934" fill="#fff"/><g font-family="Leelawadee UI, Noto Sans Thai, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="28" y="38" font-size="26" fill="#146c96" text-anchor="start" font-weight="400">STUDY / DB • ภาพ 04</text><text x="28" y="90" font-size="36" fill="#172b3a" text-anchor="start" font-weight="700">หนึ่ง Profile</text><text x="28" y="138" font-size="36" fill="#172b3a" text-anchor="start" font-weight="700">มีหลาย Skills</text><g><rect x="28" y="216" width="504" height="112" rx="10" fill="#ffffff" stroke="#146c96" stroke-width="2"/><text x="280.0" y="260" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">profile.id / PK</text><text x="280.0" y="304" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">หนึ่ง Resume</text></g><text x="280" y="378" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">1 : N</text><polyline points="280,388 280,421" fill="none" stroke="#146c96" stroke-width="3" marker-end="url(#arrow)"/><g><rect x="28" y="434" width="504" height="112" rx="10" fill="#ffffff" stroke="#146c96" stroke-width="2"/><text x="280.0" y="478" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">skill.profile_id / FK</text><text x="280.0" y="522" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">หลาย skills ต่อ profile</text></g><g data-card="true"><rect x="28" y="582" width="504" height="120" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="625" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">users.profile_id</text><text x="280" y="669" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">UNIQUE FK ในรุ่นภายหลัง</text></g><g data-card="true"><rect x="28" y="730" width="504" height="120" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="773" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">FK ไม่ตรวจว่าใครร้องขอ</text><text x="280" y="817" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">Authorization ยังจำเป็น</text></g><text x="28" y="909" font-size="24" fill="#526273" text-anchor="start" font-weight="400">ภาพอธิบายเสริม • ดูเงื่อนไขในคำบรรยาย</text></g></svg>
