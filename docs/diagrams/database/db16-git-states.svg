<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1728" viewBox="0 0 560 864" role="img" aria-labelledby="title desc" lang="th"><title id="title">Commit ไม่ใช่ Push Review ก่อนส่งงาน</title><desc id="desc">Working Tree คือไฟล์ที่แก้ Indexคือ snapshotที่stage Commitบันทึก localhistory แล้ว Pushจึงส่งremote Gitไม่backupMySQLสดและไม่deployPHPให้อัตโนมัติ</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9" fill="#6b7e8d"/></marker><marker id="inherit" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0 0L11 6L0 12Z" fill="#fff" stroke="#6b7e8d" stroke-width="1"/></marker><marker id="aggregation" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 0L12 6L6 12Z" fill="#fff" stroke="#6b7e8d" stroke-width="1"/></marker><marker id="composition" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 0L12 6L6 12Z" fill="#6b7e8d" stroke="#6b7e8d" stroke-width="1"/></marker></defs><rect width="560" height="864" fill="#fff"/><g font-family="Leelawadee UI, Noto Sans Thai, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="28" y="38" font-size="26" fill="#146c96" text-anchor="start" font-weight="400">STUDY / DB • ภาพ 17</text><text x="28" y="90" font-size="36" fill="#172b3a" text-anchor="start" font-weight="700">Commit ไม่ใช่ Push</text><text x="28" y="138" font-size="36" fill="#172b3a" text-anchor="start" font-weight="700">Review ก่อนส่งงาน</text><g data-card="true"><rect x="28" y="216" width="504" height="120" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="259" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">Working Tree → git add</text><text x="280" y="303" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">เลือกเนื้อหาเข้า Index</text></g><polyline points="280,340 280,360" fill="none" stroke="#146c96" stroke-width="3" marker-end="url(#arrow)"/><g data-card="true"><rect x="28" y="364" width="504" height="120" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="407" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">Review diff / staged diff</text><text x="280" y="451" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">ไม่ใส่ .env หรือ private dump</text></g><polyline points="280,488 280,508" fill="none" stroke="#146c96" stroke-width="3" marker-end="url(#arrow)"/><g data-card="true"><rect x="28" y="512" width="504" height="120" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="555" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">Index → git commit</text><text x="280" y="599" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">Local snapshot</text></g><polyline points="280,636 280,656" fill="none" stroke="#146c96" stroke-width="3" marker-end="url(#arrow)"/><g data-card="true"><rect x="28" y="660" width="504" height="120" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="703" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">Local → git push</text><text x="280" y="747" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">Remote ที่มีสิทธิ์</text></g><text x="28" y="839" font-size="24" fill="#526273" text-anchor="start" font-weight="400">ภาพอธิบายเสริม • ดูเงื่อนไขในคำบรรยาย</text></g></svg>
