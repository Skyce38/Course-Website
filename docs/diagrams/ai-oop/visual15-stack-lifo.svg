<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1748" viewBox="0 0 560 874" role="img" aria-labelledby="title desc" lang="th"><title id="title">Push / Pop / Peek เปลี่ยนที่ Top ด้านเดียว</title><desc id="desc">Push10,20,30ทำให้30อยู่Top จากนั้นpopคืน30และนำออก ส่วนpeekอ่าน20โดยไม่ลบจึงsizeยัง2 StackADTกำหนดLIFOแต่ไม่ได้บังคับต้องใช้linkedlistหรือPythonlist ทุกimplementationต้องตกลงempty policyในบทใช้IndexError</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9" fill="#6b7e8d"/></marker><marker id="inherit" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0 0L11 6L0 12Z" fill="#fff" stroke="#6b7e8d" stroke-width="1"/></marker><marker id="aggregation" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 0L12 6L6 12Z" fill="#fff" stroke="#6b7e8d" stroke-width="1"/></marker><marker id="composition" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 0L12 6L6 12Z" fill="#6b7e8d" stroke="#6b7e8d" stroke-width="1"/></marker></defs><rect width="560" height="874" fill="#fff"/><g font-family="Leelawadee UI, Noto Sans Thai, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="28" y="38" font-size="26" fill="#146c96" text-anchor="start" font-weight="400">STUDY / OOP 41</text><text x="28" y="90" font-size="36" fill="#172b3a" text-anchor="start" font-weight="700">Push / Pop / Peek</text><text x="28" y="138" font-size="36" fill="#172b3a" text-anchor="start" font-weight="700">เปลี่ยนที่ Top ด้านเดียว</text><g><rect x="90" y="216" width="160" height="68" rx="10" fill="#ffffff" stroke="#146c96" stroke-width="2"/><text x="170.0" y="260" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">30</text></g><g><rect x="90" y="306" width="160" height="68" rx="10" fill="#ffffff" stroke="#146c96" stroke-width="2"/><text x="170.0" y="350" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">20</text></g><g><rect x="90" y="396" width="160" height="68" rx="10" fill="#ffffff" stroke="#146c96" stroke-width="2"/><text x="170.0" y="440" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">10</text></g><polyline points="250,250 440,250" fill="none" stroke="#08776f" stroke-width="3" marker-end="url(#arrow)" data-edge="top:pop"/><text x="300" y="306" font-size="32" fill="#172b3a" text-anchor="start" font-weight="400">Pop → 30</text><text x="300" y="366" font-size="32" fill="#172b3a" text-anchor="start" font-weight="400">Top ใหม่20</text><text x="300" y="426" font-size="32" fill="#172b3a" text-anchor="start" font-weight="400">Size เหลือ2</text><text x="28" y="564" font-size="32" fill="#172b3a" text-anchor="start" font-weight="600">หลัง Pop • ล่าง → Top</text><rect x="28.0" y="584" width="249.0" height="62" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="154.0" y="626" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">10</text><rect x="280.0" y="584" width="249.0" height="62" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="406.0" y="626" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">20</text><rect x="28" y="670" width="504" height="120" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="713" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">Peek → 20 (ไม่ลบ)</text><text x="280" y="757" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">Size ยังคง 2</text><text x="28" y="849" font-size="24" fill="#526273" text-anchor="start" font-weight="400">ภาพอธิบายเสริม • ดูเงื่อนไขในคำบรรยาย</text></g></svg>
