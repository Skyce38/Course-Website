<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="2024" viewBox="0 0 560 1012" role="img" aria-labelledby="title desc" lang="th"><title id="title">House กับ Room Ownership ไม่ใช่คำสั่ง GC</title><desc id="desc">Houseสร้างRoomภายในจากข้อมูลชื่อ/พื้นที่ Living20 Kitchen12 Bath6 รวม38ตามตัวอย่าง การควบคุมRoomผ่านinterfaceแสดงcompositionเชิงdomain เพชรอยู่ฝั่งHouse ไม่ได้บังคับว่าdel houseทำลายทุกRoomทันทีหากมีaliasหรือเปลี่ยนinterface</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9" fill="#6b7e8d"/></marker><marker id="inherit" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0 0L11 6L0 12Z" fill="#fff" stroke="#6b7e8d" stroke-width="1"/></marker><marker id="aggregation" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 0L12 6L6 12Z" fill="#fff" stroke="#6b7e8d" stroke-width="1"/></marker><marker id="composition" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 0L12 6L6 12Z" fill="#6b7e8d" stroke="#6b7e8d" stroke-width="1"/></marker></defs><rect width="560" height="1012" fill="#fff"/><g font-family="Leelawadee UI, Noto Sans Thai, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="28" y="38" font-size="26" fill="#146c96" text-anchor="start" font-weight="400">STUDY / OOP 36</text><text x="28" y="90" font-size="36" fill="#172b3a" text-anchor="start" font-weight="700">House กับ Room</text><text x="28" y="138" font-size="36" fill="#172b3a" text-anchor="start" font-weight="700">Ownership ไม่ใช่คำสั่ง GC</text><g data-node="house"><rect x="105" y="216" width="350" height="68" rx="10" fill="#ffffff" stroke="#146c96" stroke-width="2"/><text x="280.0" y="260" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">House</text></g><g data-node="rooms"><rect x="105" y="391" width="350" height="68" rx="10" fill="#ffffff" stroke="#146c96" stroke-width="2"/><text