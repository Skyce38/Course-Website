<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1848" viewBox="0 0 560 924" role="img" aria-labelledby="title desc" lang="th"><title id="title">ระยะระหว่างกลุ่ม ไม่ใช่ระหว่าง Centroid</title><desc id="desc">หลังรวม{1,2} ระยะไป3ใน matrix เดิมคือ6และ3 จึง single=min=3 complete=max=6 average=(6+3)/2=4.5 ส่วน average รอบสุดท้ายของ{1,2,3}กับ{4,5}ต้องเฉลี่ย cross-pairs ทั้งหกคือ10,9,9,8,7,5 ไม่ให้น้ำหนักกลุ่มย่อยเท่ากันโดยไม่ดูสมาชิก</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9" fill="#6b7e8d"/></marker><marker id="inherit" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0 0L11 6L0 12Z" fill="#fff" stroke="#6b7e8d" stroke-width="1"/></marker><marker id="aggregation" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 0L12 6L6 12Z" fill="#fff" stroke="#6b7e8d" stroke-width="1"/></marker><marker id="composition" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 0L12 6L6 12Z" fill="#6b7e8d" stroke="#6b7e8d" stroke-width="1"/></marker></defs><rect width="560" height="924" fill="#fff"/><g font-family="Leelawadee UI, Noto Sans Thai, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="28" y="38" font-size="26" fill="#146c96" text-anchor="start" font-weight="400">STUDY / AI 14</text><text x="28" y="90" font-size="36" fill="#172b3a" text-anchor="start" font-weight="700">ระยะระหว่างกลุ่ม</text><text x="28" y="138" font-size="36" fill="#172b3a" text-anchor="start" font-weight="700">ไม่ใช่ระหว่าง Centroid</text><text x="28" y="244" font-size="32" fill="#172b3a" text-anchor="start" font-weight="600">{1,2} ไป {3} • ระยะคู่สมาชิก</text><rect x="28.0" y="264" width="249.0" height="62" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="154.0" y="306" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">6</text><rect x="280.0" y="264" width="249.0" height="62" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="406.0" y="306" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">3</text><g data-card="true"><rect x="28" y="350" width="504" height="164" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="393" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">Single → min(6,3) = 3</text><text x="280" y="437" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">Complete → max(6,3) = 6</text><text x="280" y="481" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">Average → (6+3)/2 = 4.5</text></g><text x="28" y="570" font-size="32" fill="#172b3a" text-anchor="start" font-weight="600">{1,2,3} ไป {4,5} • 3×2 คู่</text><rect x="28.0" y="590" width="81.0" height="62" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="70.0" y="632" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">10</text><rect x="112.0" y="590" width="81.0" height="62" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="154.0" y="632" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">9</text><rect x="196.0" y="590" width="81.0" height="62" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="238.0" y="632" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">9</text><rect x="280.0" y="590" width="81.0" height="62" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="322.0" y="632" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">8</text><rect x="364.0" y="590" width="81.0" height="62" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="406.0" y="632" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">7</text><rect x="448.0" y="590" width="81.0" height="62" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="490.0" y="632" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">5</text><g data-card="true"><rect x="28" y="676" width="504" height="164" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="719" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">Average รอบสุดท้าย</text><text x="280" y="763" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">48 / 6 = 8</text><text x="280" y="807" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">ไม่ใช่ระยะของจุดศูนย์กลาง</text></g><text x="28" y="899" font-size="24" fill="#526273" text-anchor="start" font-weight="400">ภาพอธิบายเสริม • ดูเงื่อนไขในคำบรรยาย</text></g></svg>
