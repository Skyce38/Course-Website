<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1580" viewBox="0 0 560 790" role="img" aria-labelledby="title desc" lang="th"><title id="title">เรียก area() เหมือนกัน Dispatch ตาม Object ผู้รับ</title><desc id="desc">Clientเรียกs.area()สำหรับแต่ละobject Circleรัศมี2ให้4π≈12.566371 ส่วนRectangle3×4ให้12 แต่ละobjectมีสูตรของตนเองผ่านinterfaceเดียว การปัดสองตำแหน่งเป็นformatตอนแสดงไม่ใช้เป็นค่ากลางคำนวณ</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9" fill="#6b7e8d"/></marker><marker id="inherit" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0 0L11 6L0 12Z" fill="#fff" stroke="#6b7e8d" stroke-width="1"/></marker><marker id="aggregation" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 0L12 6L6 12Z" fill="#fff" stroke="#6b7e8d" stroke-width="1"/></marker><marker id="composition" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 0L12 6L6 12Z" fill="#6b7e8d" stroke="#6b7e8d" stroke-width="1"/></marker></defs><rect width="560" height="790" fill="#fff"/><g font-family="Leelawadee UI, Noto Sans Thai, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="28" y="38" font-size="26" fill="#146c96" text-anchor="start" font-weight="400">STUDY / OOP 33</text><text x="28" y="90" font-size="36" fill="#172b3a" text-anchor="start" font-weight="700">เรียก area() เหมือนกัน</text><text x="28" y="138" font-size="36" fill="#172b3a" text-anchor="start" font-weight="700">Dispatch ตาม Object ผู้รับ</text><g data-node="client"><rect x="105" y="216" width="350" height="68" rx="10" fill="#ffffff" stroke="#146c96" stroke-width="2"/><text x="280.0" y="260" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">Client: s.area()</text></g><g data-node="circle"><rect x="28" y="401" width="230" height="68" rx="10" fill="#ffffff" stroke="#146c96" stroke-width="2"/><text x="143.0" y="445" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">Circle(2)</text></g><g data-node="rect"><rect x="302" y="401" width="230" height="68" rx="10" fill="#ffffff" stroke="#146c96" stroke-width="2"/><text x="417.0" y="445" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">Rectangle</text></g><polyline points="280,284 143,401" fill="none" stroke="#146c96" stroke-width="3" marker-end="url(#arrow)" data-edge="client:circle"/><polyline points="280,284 417,401" fill="none" stroke="#146c96" stroke-width="3" marker-end="url(#arrow)" data-edge="client:rect"/><text x="143" y="526" font-size="28" fill="#172b3a" text-anchor="middle" font-weight="400">4π ≈ 12.566371</text><text x="417" y="526" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">3×4 = 12</text><g data-card="true"><rect x="28" y="586" width="504" height="120" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="629" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">เลือกตาม Object ที่กำลังเรียก</text><text x="280" y="673" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">ไม่ต้องเพิ่ม if ชื่อ Class ทุกตัว</text></g><text x="28" y="765" font-size="24" fill="#526273" text-anchor="start" font-weight="400">ภาพอธิบายเสริม • ดูเงื่อนไขในคำบรรยาย</text></g></svg>
