<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1968" viewBox="0 0 560 984" role="img" aria-labelledby="title desc" lang="th"><title id="title">BFS กับ DFS Visit ไม่ใช่ Path</title><desc id="desc">BFS dequeue ตามลำดับ S A B C G แต่เส้นทางคำตอบ S B G มีสองขอบ; DFS แบบ frame ตาม tuple เข้า S A C D G และคำตอบมีสี่ขอบ ขณะ BFS จบยังมี D ใน queue จึงห้ามใช้ discovered แทน visit</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9" fill="#6b7e8d"/></marker><marker id="inherit" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0 0L11 6L0 12Z" fill="#fff" stroke="#6b7e8d" stroke-width="1"/></marker><marker id="aggregation" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 0L12 6L6 12Z" fill="#fff" stroke="#6b7e8d" stroke-width="1"/></marker><marker id="composition" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 0L12 6L6 12Z" fill="#6b7e8d" stroke="#6b7e8d" stroke-width="1"/></marker></defs><rect width="560" height="984" fill="#fff"/><g font-family="Leelawadee UI, Noto Sans Thai, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="28" y="38" font-size="26" fill="#146c96" text-anchor="start" font-weight="400">STUDY / AI 04</text><text x="28" y="90" font-size="36" fill="#172b3a" text-anchor="start" font-weight="700">BFS กับ DFS</text><text x="28" y="138" font-size="36" fill="#172b3a" text-anchor="start" font-weight="700">Visit ไม่ใช่ Path</text><text x="28" y="244" font-size="32" fill="#172b3a" text-anchor="start" font-weight="600">BFS • Visit เมื่อ dequeue</text><rect x="28.0" y="264" width="97.8" height="62" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="78.4" y="306" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">S</text><rect x="128.8" y="264" width="97.8" height="62" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="179.2" y="306" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">A</text><rect x="229.6" y="264" width="97.8" height="62" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280.0" y="306" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">B</text><rect x="330.4" y="264" width="97.8" height="62" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="380.8" y="306" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">C</text><rect x="431.2" y="264" width="97.8" height="62" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="481.59999999999997" y="306" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">G</text><rect x="28" y="350" width="504" height="120" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="393" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">คำตอบ S → B → G</text><text x="280" y="437" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">2 ขอบ • ตื้นที่สุดในกราฟนี้</text><text x="28" y="526" font-size="32" fill="#172b3a" text-anchor="start" font-weight="600">DFS • เข้า frame ตาม tuple</text><rect x="28.0" y="546" width="97.8" height="62" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="78.4" y="588" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">S</text><rect x="128.8" y="546" width="97.8" height="62" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="179.2" y="588" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">A</text><rect x="229.6" y="546" width="97.8" height="62" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280.0" y="588" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">C</text><rect x="330.4" y="546" width="97.8" height="62" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="380.8" y="588" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">D</text><rect x="431.2" y="546" width="97.8" height="62" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="481.59999999999997" y="588" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">G</text><rect x="28" y="632" width="504" height="120" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="675" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">คำตอบ S → A → C → D → G</text><text x="280" y="719" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">4 ขอบ • ไม่รับรองสั้นที่สุด</text><rect x="28" y="780" width="504" height="120" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="823" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">BFS หยุดแล้ว Q ยังมี D</text><text x="280" y="867" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">Discovered ≠ Visit ≠ Path</text><text x="28" y="959" font-size="24" fill="#526273" text-anchor="start" font-weight="400">ภาพอธิบายเสริม • ดูเงื่อนไขในคำบรรยาย</text></g></svg>
