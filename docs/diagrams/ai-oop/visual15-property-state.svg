<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="2024" viewBox="0 0 560 1012" role="img" aria-labelledby="title desc" lang="th"><title id="title">คำสั่งล้มเหลว ต้องคง Balance และ Count</title><desc id="desc">Accountเริ่ม1000/count0 ฝาก500ได้1500/count1 ถอน200ได้1300/count2 แล้วbalance=−1หรือwithdraw1400ถูกปฏิเสธก่อนแก้state จึงยัง1300/count2 การตั้งbalanceผ่านsetterโดยตรงที่ผ่านกฎไม่ใช่depositและไม่เพิ่มcountตามนิยามบท</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9" fill="#6b7e8d"/></marker><marker id="inherit" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0 0L11 6L0 12Z" fill="#fff" stroke="#6b7e8d" stroke-width="1"/></marker><marker id="aggregation" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 0L12 6L6 12Z" fill="#fff" stroke="#6b7e8d" stroke-width="1"/></marker><marker id="composition" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 0L12 6L6 12Z" fill="#6b7e8d" stroke="#6b7e8d" stroke-width="1"/></marker></defs><rect width="560" height="1012" fill="#fff"/><g font-family="Leelawadee UI, Noto Sans Thai, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="28" y="38" font-size="26" fill="#146c96" text-anchor="start" font-weight="400">STUDY / OOP 30</text><text x="28" y="90" font-size="36" fill="#172b3a" text-anchor="start" font-weight="700">คำสั่งล้มเหลว</text><text x="28" y="138" font-size="36" fill="#172b3a" text-anchor="start" font-weight="700">ต้องคง Balance และ Count</text><g data-card="true"><rect x="28" y="216" width="504" height="120" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="259" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">สร้าง</text><text x="280" y="303" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">Balance 1000 / Count 0</text></g><g data-card="true"><rect x="28" y="364" width="504" height="120" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="407" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">Deposit 500</text><text x="280" y="451" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">Balance 1500 / Count 1</text></g><g data-card="true"><rect x="28" y="512" width="504" height="120" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="555" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">Withdraw 200</text><text x="280" y="599" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">Balance 1300 / Count 2</text></g><g data-card="true"><rect x="28" y="660" width="504" height="120" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="703" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">Reject balance=−1</text><text x="280" y="747" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">Balance 1300 / Count 2</text></g><g data-card="true"><rect x="28" y="808" width="504" height="120" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="851" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">Reject withdraw 1400</text><text x="280" y="895" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">Balance 1300 / Count 2</text></g><text x="28" y="987" font-size="24" fill="#526273" text-anchor="start" font-weight="400">ภาพอธิบายเสริม • ดูเงื่อนไขในคำบรรยาย</text></g></svg>
