<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1836" viewBox="0 0 560 918" role="img" aria-labelledby="title desc" lang="th"><title id="title">รับรู้ แล้วกระทำ เป็นวงจรในสิ่งแวดล้อม</title><desc id="desc">สิ่งแวดล้อมส่ง percepts ผ่าน sensors ให้ Agent; Agent ส่ง actions ผ่าน actuators กลับสู่สิ่งแวดล้อม แล้วรับข้อมูลรอบใหม่ เป้าหมายเป็นเกณฑ์เลือก ไม่ใช่ percept และการเรียนรู้ออนไลน์ไม่ใช่เงื่อนไขบังคับ</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9" fill="#6b7e8d"/></marker><marker id="inherit" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0 0L11 6L0 12Z" fill="#fff" stroke="#6b7e8d" stroke-width="1"/></marker><marker id="aggregation" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 0L12 6L6 12Z" fill="#fff" stroke="#6b7e8d" stroke-width="1"/></marker><marker id="composition" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 0L12 6L6 12Z" fill="#6b7e8d" stroke="#6b7e8d" stroke-width="1"/></marker></defs><rect width="560" height="918" fill="#fff"/><g font-family="Leelawadee UI, Noto Sans Thai, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="28" y="38" font-size="26" fill="#146c96" text-anchor="start" font-weight="400">STUDY / AI 01</text><text x="28" y="90" font-size="36" fill="#172b3a" text-anchor="start" font-weight="700">รับรู้ แล้วกระทำ</text><text x="28" y="138" font-size="36" fill="#172b3a" text-anchor="start" font-weight="700">เป็นวงจรในสิ่งแวดล้อม</text><g data-node="environment"><rect x="100" y="216" width="360" height="68" rx="10" fill="#ffffff" stroke="#146c96" stroke-width="2"/><text x="280.0" y="260" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">สิ่งแวดล้อม</text></g><g data-node="agent"><rect x="100" y="456" width="360" height="68" rx="10" fill="#ffffff" stroke="#146c96" stroke-width="2"/><text x="280.0" y="500" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">Agent</text></g><polyline points="120,284 120,456" fill="none" stroke="#146c96" stroke-width="3" marker-end="url(#arrow)" data-edge="environment:agent"/><text x="150" y="341" font-size="32" fill="#146c96" text-anchor="start" font-weight="400">Percepts</text><text x="150" y="383" font-size="32" fill="#172b3a" text-anchor="start" font-weight="400">ผ่าน Sensors</text><polyline points="440,456 440,284" fill="none" stroke="#08776f" stroke-width="3" marker-end="url(#arrow)" data-edge="agent:environment"/><text x="280" y="441" font-size="32" fill="#08776f" text-anchor="start" font-weight="400">Actions ↑</text><rect x="28" y="566" width="504" height="120" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="609" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">Actions ผ่าน Actuators</text><text x="280" y="653" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">เป้าหมาย ≠ สิ่งรับรู้</text><rect x="28" y="714" width="504" height="120" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="757" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">รับ Percepts รอบใหม่</text><text x="280" y="801" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">ไม่จบหลังทำ Action ครั้งเดียว</text><text x="28" y="893" font-size="24" fill="#526273" text-anchor="start" font-weight="400">ภาพอธิบายเสริม • ดูเงื่อนไขในคำบรรยาย</text></g></svg>
