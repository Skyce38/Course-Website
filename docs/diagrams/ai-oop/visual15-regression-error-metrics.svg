<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="2268" viewBox="0 0 560 1134" role="img" aria-labelledby="title desc" lang="th"><title id="title">Error หักล้างได้ แต่ความคลาดเคลื่อนไม่หาย</title><desc id="desc">ตัวอย่าง X07 sheet err มี actual (2,2,0) และ predicted (2,0,2) จึง residual (0,2,−2) ผลรวมเป็นศูนย์แต่ absolute รวม 4 และ squared รวม 8: MAE=4/3 MSE=8/3 และ RMSE=√(8/3) ไม่เติมหน่วยที่แหล่งไม่ได้ระบุ</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9" fill="#6b7e8d"/></marker><marker id="inherit" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0 0L11 6L0 12Z" fill="#fff" stroke="#6b7e8d" stroke-width="1"/></marker><marker id="aggregation" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 0L12 6L6 12Z" fill="#fff" stroke="#6b7e8d" stroke-width="1"/></marker><marker id="composition" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 0L12 6L6 12Z" fill="#6b7e8d" stroke="#6b7e8d" stroke-width="1"/></marker></defs><rect width="560" height="1134" fill="#fff"/><g font-family="Leelawadee UI, Noto Sans Thai, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="28" y="38" font-size="26" fill="#146c96" text-anchor="start" font-weight="400">STUDY / AI 06</text><text x="28" y="90" font-size="36" fill="#172b3a" text-anchor="start" font-weight="700">Error หักล้างได้</text><text x="28" y="138" font-size="36" fill="#172b3a" text-anchor="start" font-weight="700">แต่ความคลาดเคลื่อนไม่หาย</text><text x="28" y="244" font-size="32" fill="#172b3a" text-anchor="start" font-weight="600">Actual</text><rect x="28.0" y="264" width="165.0" height="62" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="112.0" y="306" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">2</text><rect x="196.0" y="264" width="165.0" height="62" rx="10" fill="#f2f6f8" strok