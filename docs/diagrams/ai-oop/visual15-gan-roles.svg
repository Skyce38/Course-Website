<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="2040" viewBox="0 0 560 1020" role="img" aria-labelledby="title desc" lang="th"><title id="title">GAN แยกสองบทบาท Generator กับ Discriminator</title><desc id="desc">Noiseเข้าGeneratorเพื่อสร้างตัวอย่าง ส่วนDiscriminatorรับทั้งข้อมูลจริงและข้อมูลสร้างเพื่อแยกreal/fake ระหว่างtraining สัญญาณreal/fakeมาจากแหล่งตัวอย่าง แม้ไม่ได้ใช้human class labelsภายนอก ไม่ใช่ภาพโมเดลที่ฝึกสำเร็จแล้วและไม่ได้รับประกันว่าทุกstyle transferใช้GAN</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9" fill="#6b7e8d"/></marker><marker id="inherit" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0 0L11 6L0 12Z" fill="#fff" stroke="#6b7e8d" stroke-width="1"/></marker><marker id="aggregation" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 0L12 6L6 12Z" fill="#fff" stroke="#6b7e8d" stroke-width="1"/></marker><marker id="composition" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 0L12 6L6 12Z" fill="#6b7e8d" stroke="#6b7e8d" stroke-width="1"/></marker></defs><rect width="560" height="1020" fill="#fff"/><g font-family="Leelawadee UI, Noto Sans Thai, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="28" y="38" font-size="26" fill="#146c96" text-anchor="start" font-weight="400">STUDY / AI 22</text><text x="28" y="90" font-size="36" fill="#172b3a" text-anchor="start" font-weight="700">GAN แยกสองบทบาท</text><text x="28" y="138" font-size="36" fill="#172b3a" text-anchor="start" font-weight="700">Generator กับ Discriminator</text><g data-node="noise"><rect x="28" y="216" width="220" height="68" rx="10" fill="#ffffff" stroke="#146c96" stroke-width="2"/><text x="138.0" y="260" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">Noise</text></g><g data-node="G"><rect x="28" y="356" width="220" height="68" rx="10" fill="#ffffff" stroke="#146c96" stroke-width="2"/><text x="138.0" y="400" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">Generator</text></g><g data-node="fake"><rect x="28" y="496" width="220" height="68" rx="10" fill="#ffffff" stroke="#146c96" stroke-width="2"/><text x="138.0" y="540" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">ข้อมูลสร้าง</text></g><g data-node="real"><rect x="312" y="496" width="220" height="68" rx="10" fill="#ffffff" stroke="#146c96" stroke-width="2"/><text x="422.0" y="540" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">ข้อมูลจริง</text></g><polyline points="138,284 138,356" fill="none" stroke="#146c96" stroke-width="3" marker-end="url(#arrow)" data-edge="noise:G"/><polyline points="138,424 138,496" fill="none" stroke="#146c96" stroke-width="3" marker-end="url(#arrow)" data-edge="G:fake"/><g data-node="D"><rect x="105" y="696" width="350" height="68" rx="10" fill="#ffffff" stroke="#146c96" stroke-width="2"/><text x="280.0" y="740" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">Discriminator</text></g><polyline points="138,564 280,696" fill="none" stroke="#08776f" stroke-width="3" marker-end="url(#arrow)" data-edge="fake:D"/><polyline points="422,564 280,696" fill="none" stroke="#08776f" stroke-width="3" marker-end="url(#arrow)" data-edge="real:D"/><rect x="28" y="816" width="504" height="120" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="859" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">D แยก Real / Fake</text><text x="280" y="903" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">G สร้าง ไม่ได้ตัดสิน Real / Fake</text><text x="28" y="995" font-size="24" fill="#526273" text-anchor="start" font-weight="400">ภาพอธิบายเสริม • ดูเงื่อนไขในคำบรรยาย</text></g></svg>
