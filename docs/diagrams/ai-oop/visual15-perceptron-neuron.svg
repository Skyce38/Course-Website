<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1912" viewBox="0 0 560 956" role="img" aria-labelledby="title desc" lang="th"><title id="title">Weighted Sum กับ Bias ต้องประกาศ Threshold</title><desc id="desc">Perceptron ของ X06 ใช้ z=b+w1x1+w2x2 และให้y=1เฉพาะz&gt;0; ที่z=0ให้0 ตาม strict convention ของบท ไม่สลับกับbipolar±1หรือsigmoid และไม่ตีความlearning rateเป็นaccuracy</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9" fill="#6b7e8d"/></marker><marker id="inherit" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0 0L11 6L0 12Z" fill="#fff" stroke="#6b7e8d" stroke-width="1"/></marker><marker id="aggregation" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 0L12 6L6 12Z" fill="#fff" stroke="#6b7e8d" stroke-width="1"/></marker><marker id="composition" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 0L12 6L6 12Z" fill="#6b7e8d" stroke="#6b7e8d" stroke-width="1"/></marker></defs><rect width="560" height="956" fill="#fff"/><g font-family="Leelawadee UI, Noto Sans Thai, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="28" y="38" font-size="26" fill="#146c96" text-anchor="start" font-weight="400">STUDY / AI 17</text><text x="28" y="90" font-size="36" fill="#172b3a" text-anchor="start" font-weight="700">Weighted Sum กับ Bias</text><text x="28" y="138" font-size="36" fill="#172b3a" text-anchor="start" font-weight="700">ต้องประกาศ Threshold</text><g data-node="x1"><rect x="28" y="216" width="160" height="68" rx="10" fill="#ffffff" stroke="#146c96" stroke-width="2"/><text x="108.0" y="260" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">x1=0</text></g><g data-node="x2"><rect x="28" y="336" width="160" height="68" rx="10" fill="#ffffff" stroke="#146c96" stroke-width="2"/><text x="108.0" y="380" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">x2=0</text></g><g data-node="sum"><rect x="322" y="276" width="210" height="68" rx="10" fill="#ffffff" stroke="#146c96" stroke-width="2"/><text x="427.0" y="320" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">Σ + bias</text></g><polyline points="188,250 322,310" fill="none" stroke="#146c96" stroke-width="3" marker-end="url(#arrow)" data-edge="x1:sum"/><polyline points="188,370 322,310" fill="none" stroke="#146c96" stroke-width="3" marker-end="url(#arrow)" data-edge="x2:sum"/><text x="208" y="240" font-size="28" fill="#172b3a" text-anchor="start" font-weight="400">w1=.1</text><text x="208" y="413" font-size="28" fill="#172b3a" text-anchor="start" font-weight="400">w2=.1</text><g data-card="true"><rect x="28" y="456" width="504" height="120" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="499" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">z = 0.1 + 0.1(0) + 0.1(0)</text><text x="280" y="543" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">= 0.1</text></g><polyline points="280,580 280,600" fill="none" stroke="#146c96" stroke-width="3" marker-end="url(#arrow)"/><g data-card="true"><rect x="28" y="604" width="504" height="120" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="647" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">z&gt;0 → y=1</text><text x="280" y="691" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">ถ้า z=0 → y=0</text></g><g data-card="true"><rect x="28" y="752" width="504" height="120" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="795" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">Bias คือ input คงที่ 1</text><text x="280" y="839" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">ไม่ใช่ feature ที่ลืมปรับได้</text></g><text x="28" y="931" font-size="24" fill="#526273" text-anchor="start" font-weight="400">ภาพอธิบายเสริม • ดูเงื่อนไขในคำบรรยาย</text></g></svg>
