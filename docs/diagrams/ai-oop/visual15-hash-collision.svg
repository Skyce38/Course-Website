<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1912" viewBox="0 0 560 956" role="img" aria-labelledby="title desc" lang="th"><title id="title">Collision ไม่ใช่ Key เท่ากัน ต้องตรวจ Equality ต่อ</title><desc id="desc">hashสมมติ10และ18ที่capacity8ให้index2ทั้งคู่ แต่keysต่างกันยังต้องเก็บร่วมกัน Chainingเก็บหลายentriesในbucket2 ส่วนLinearProbingลอง2แล้ว3เมื่อชน ไม่ทิ้งentryเก่าและไม่ใช้hashเท่ากันแทนequality</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9" fill="#6b7e8d"/></marker><marker id="inherit" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0 0L11 6L0 12Z" fill="#fff" stroke="#6b7e8d" stroke-width="1"/></marker><marker id="aggregation" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 0L12 6L6 12Z" fill="#fff" stroke="#6b7e8d" stroke-width="1"/></marker><marker id="composition" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 0L12 6L6 12Z" fill="#6b7e8d" stroke="#6b7e8d" stroke-width="1"/></marker></defs><rect width="560" height="956" fill="#fff"/><g font-family="Leelawadee UI, Noto Sans Thai, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="28" y="38" font-size="26" fill="#146c96" text-anchor="start" font-weight="400">STUDY / OOP 49</text><text x="28" y="90" font-size="36" fill="#172b3a" text-anchor="start" font-weight="700">Collision ไม่ใช่ Key เท่ากัน</text><text x="28" y="138" font-size="36" fill="#172b3a" text-anchor="start" font-weight="700">ต้องตรวจ Equality ต่อ</text><text x="28" y="244" font-size="32" fill="#172b3a" text-anchor="start" font-weight="600">Hash สมมติของ Key ต่างกัน</text><rect x="28.0" y="264" width="249.0" height="62" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="154.0" y="306" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">10</text><rect x="280.0" y="264" width="249.0" height="62" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="406.0" y="306" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">18</text><rect x="28" y="350" width="504" height="120" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="393" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">10 % 8 = 2</text><text x="280" y="437" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">18 % 8 = 2</text><g data-node="bucket"><rect x="28" y="498" width="190" height="68" rx="10" fill="#ffffff" stroke="#146c96" stroke-width="2"/><text x="123.0" y="542" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">Bucket 2</text></g><g data-node="entries"><rect x="342" y="498" width="190" height="68" rx="10" fill="#ffffff" stroke="#146c96" stroke-width="2"/><text x="437.0" y="542" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">Key A, B</text></g><polyline points="218,532 342,532" fill="none" stroke="#146c96" stroke-width="3" marker-end="url(#arrow)" data-edge="bucket:entries"/><rect x="28" y="618" width="504" height="120" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="661" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">Chaining: เก็บสอง Entries ร่วมกัน</text><text x="280" y="705" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">แต่ยังตรวจว่า Key ใด Equal</text><text x="28" y="794" font-size="32" fill="#172b3a" text-anchor="start" font-weight="600">Probing: เริ่ม2 แล้วลอง3ถ้าชน</text><rect x="28.0" y="814" width="249.0" height="62" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="154.0" y="856" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">2</text><rect x="280.0" y="814" width="249.0" height="62" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="406.0" y="856" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">3</text><text x="28" y="931" font-size="24" fill="#526273" text-anchor="start" font-weight="400">ภาพอธิบายเสริม • ดูเงื่อนไขในคำบรรยาย</text></g></svg>
