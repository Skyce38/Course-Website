<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1740" viewBox="0 0 560 870" role="img" aria-labelledby="title desc" lang="th"><title id="title">AI, ML และ DL ขอบเขตที่ซ้อนกัน</title><desc id="desc">กรอบ AI ครอบ ML และกรอบ ML ครอบ Deep Learning: BFS เป็นตัวอย่าง AI ที่ไม่ต้องเรียนจากข้อมูล; KNN เป็น ML ที่ไม่ใช่ deep neural network; deep CNN อยู่ใน DL ขนาดกรอบไม่ได้แทนสถิติหรือประสิทธิภาพ</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9" fill="#6b7e8d"/></marker><marker id="inherit" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0 0L11 6L0 12Z" fill="#fff" stroke="#6b7e8d" stroke-width="1"/></marker><marker id="aggregation" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 0L12 6L6 12Z" fill="#fff" stroke="#6b7e8d" stroke-width="1"/></marker><marker id="composition" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 0L12 6L6 12Z" fill="#6b7e8d" stroke="#6b7e8d" stroke-width="1"/></marker></defs><rect width="560" height="870" fill="#fff"/><g font-family="Leelawadee UI, Noto Sans Thai, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="28" y="38" font-size="26" fill="#146c96" text-anchor="start" font-weight="400">STUDY / AI 02</text><text x="28" y="90" font-size="36" fill="#172b3a" text-anchor="start" font-weight="700">AI, ML และ DL</text><text x="28" y="138" font-size="36" fill="#172b3a" text-anchor="start" font-weight="700">ขอบเขตที่ซ้อนกัน</text><rect x="28" y="216" width="504" height="420" rx="10" fill="#f2f6f8" stroke="#146c96" stroke-width="2"/><text x="55" y="263" font-size="36" fill="#146c96" text-anchor="start" font-weight="700">AI</text><text x="55" y="307" font-size="30" fill="#172b3a" text-anchor="start" font-weight="400">เช่น BFS / กฎที่ออกแบบไว้</text><rect x="70" y="338" width="420" height="270" rx="10" fill="#e9f2f6" stroke="#08776f" stroke-width="2"/><text x="96" y="381" font-size="36" fill="#08776f" text-anchor="start" font-weight="700">ML</text><text x="96" y="424" font-size="32" fill="#172b3a" text-anchor="start" font-weight="400">เช่น KNN</text><rect x="112" y="456" width="336" height="122" rx="10" fill="#fff" stroke="#146c96" stroke-width="2"/><text x="140" y="499" font-size="32" fill="#146c96" text-anchor="start" font-weight="600">Deep Learning</text><text x="140" y="542" font-size="32" fill="#172b3a" text-anchor="start" font-weight="400">เช่น deep CNN</text><g data-card="true"><rect x="28" y="666" width="504" height="120" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="709" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">เป็น Agent ไม่บังคับใช้ ML</text><text x="280" y="753" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">เป็น ML ไม่จำเป็นต้องเป็น DL</text></g><text x="28" y="845" font-size="24" fill="#526273" text-anchor="start" font-weight="400">ภาพอธิบายเสริม • ดูเงื่อนไขในคำบรรยาย</text></g></svg>
