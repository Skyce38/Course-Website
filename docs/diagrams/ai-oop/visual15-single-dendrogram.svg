<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1730" viewBox="0 0 560 865" role="img" aria-labelledby="title desc" lang="th"><title id="title">Dendrogram แบบ Single ความสูงคือระยะ Linkage</title><desc id="desc">จาก matrix หมายเลข1–5 หน้า22 รวม1กับ2ที่ระยะ2 แล้วรวม3ที่3; รวม4กับ5ที่4 และรวมสองกลุ่มที่5 เส้นตัด4.5จึงเหลือ{1,2,3}กับ{4,5} ตามกฎรวม height≤threshold ตำแหน่งแนวนอนไม่ได้แทนระยะ</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9" fill="#6b7e8d"/></marker><marker id="inherit" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0 0L11 6L0 12Z" fill="#fff" stroke="#6b7e8d" stroke-width="1"/></marker><marker id="aggregation" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 0L12 6L6 12Z" fill="#fff" stroke="#6b7e8d" stroke-width="1"/></marker><marker id="composition" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 0L12 6L6 12Z" fill="#6b7e8d" stroke="#6b7e8d" stroke-width="1"/></marker></defs><rect width="560" height="865" fill="#fff"/><g font-family="Leelawadee UI, Noto Sans Thai, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="28" y="38" font-size="26" fill="#146c96" text-anchor="start" font-weight="400">STUDY / AI 13</text><text x="28" y="90" font-size="36" fill="#172b3a" text-anchor="start" font-weight="700">Dendrogram แบบ Single</text><text x="28" y="138" font-size="36" fill="#172b3a" text-anchor="start" font-weight="700">ความสูงคือระยะ Linkage</text><text x="28" y="230" font-size="30" fill="#172b3a" text-anchor="start" font-weight="600">ระยะ Linkage</text><polyline points="48,256 48,576" fill="none" stroke="#6b7e8d" stroke-width="3"/><text x="35" y="466" font-size="28" fill="#172b3a" text-anchor="end" font-weight="400">2</text><text x="35" y="406" font-size="28" fill="#172b3a" text-anchor="end" font-weight="400">3</text><text x="35" y="346" font-size="28" fill="#172b3a" text-anchor="end" font-weight="400">4</text><text x="35" y="286" font-size="28" fill="#172b3a" text-anchor="end" font-weight="400">5</text><polyline points="80,576 80,456 180,456 180,576" fill="none" stroke="#146c96" stroke-width="3" data-edge="12"/><polyline points="130.0,456 130.0,396 280,396 280,576" fill="none" stroke="#146c96" stroke-width="3" data-edge="123"/><polyline points="380,576 380,336 480,336 480,576" fill="none" stroke="#146c96" stroke-width="3" data-edge="45"/><polyline points="205.0,396 205.0,276 430.0,276 430.0,336" fill="none" stroke="#146c96" stroke-width="3" data-edge="all"/><polyline points="57,306 520,306" fill="none" stroke="#a53838" stroke-width="3" stroke-dasharray="8 6"/><text x="518" y="298" font-size="27" fill="#a53838" text-anchor="end" font-weight="400">cut 4.5</text><text x="80" y="618" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">1</text><text x="180" y="618" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">2</text><text x="280" y="618" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">3</text><text x="380" y="618" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">4</text><text x="480" y="618" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">5</text><g data-card="true"><rect x="28" y="661" width="504" height="120" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="704" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">ตัดที่ 4.5 → 2 กลุ่ม</text><text x="280" y="748" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">{1,2,3} และ {4,5}</text></g><text x="28" y="840" font-size="24" fill="#526273" text-anchor="start" font-weight="400">ภาพอธิบายเสริม • ดูเงื่อนไขในคำบรรยาย</text></g></svg>
