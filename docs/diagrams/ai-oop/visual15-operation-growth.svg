<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1996" viewBox="0 0 560 998" role="img" aria-labelledby="title desc" lang="th"><title id="title">Operation Model ก่อน Big-O ตัวเลขไม่ใช่เวลาเป็นวินาที</title><desc id="desc">เมื่อนับงานคงที่ต่อรอบ loopnให้nครั้ง หารช่วงครึ่งจากnที่เป็นกำลังสองให้log2nขั้น และloopสามเหลี่ยมให้n(n−1)/2 comparisons ที่n8เป็น8,3,28และn16เป็น16,4,120 Big-Oเป็นupperboundไม่ใช่คำว่าworstcaseโดยตัวมันเอง</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9" fill="#6b7e8d"/></marker><marker id="inherit" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0 0L11 6L0 12Z" fill="#fff" stroke="#6b7e8d" stroke-width="1"/></marker><marker id="aggregation" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 0L12 6L6 12Z" fill="#fff" stroke="#6b7e8d" stroke-width="1"/></marker><marker id="composition" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 0L12 6L6 12Z" fill="#6b7e8d" stroke="#6b7e8d" stroke-width="1"/></marker></defs><rect width="560" height="998" fill="#fff"/><g font-family="Leelawadee UI, Noto Sans Thai, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="28" y="38" font-size="26" fill="#146c96" text-anchor="start" font-weight="400">STUDY / OOP 45</text><text x="28" y="90" font-size="36" fill="#172b3a" text-anchor="start" font-weight="700">Operation Model ก่อน Big-O</text><text x="28" y="138" font-size="36" fill="#172b3a" text-anchor="start" font-weight="700">ตัวเลขไม่ใช่เวลาเป็นวินาที</text><text x="28" y="244" font-size="32" fill="#172b3a" text-anchor="start" font-weight="600">n ตัวอย่าง</text><rect x="28.0" y="264" width="249.0" height="62" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="154.0" y="306" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">8</text><rect x="280.0" y="264" width="249.0" height="62" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="406.0" y="306" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">16</text><rect x="28" y="350" width="504" height="120" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="393" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">Loop n รอบ</text><text x="280" y="437" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">8 → 16 Operations</text><rect x="28" y="498" width="504" height="120" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="541" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">หารครึ่งจนถึง1</text><text x="280" y="585" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">log₂8=3 → log₂16=4 ขั้น</text><rect x="28" y="646" width="504" height="120" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="689" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">Loop สามเหลี่ยม n(n−1)/2</text><text x="280" y="733" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">28 → 120 Comparisons</text><rect x="28" y="794" width="504" height="120" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="837" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">ระบุ Best / Worst / Amortized</text><text x="280" y="881" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">ก่อนสรุป Bound ของกรณีนั้น</text><text x="28" y="973" font-size="24" fill="#526273" text-anchor="start" font-weight="400">ภาพอธิบายเสริม • ดูเงื่อนไขในคำบรรยาย</text></g></svg>
