ight="62" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="112.0" y="708" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">T</text><rect x="196.0" y="666" width="165.0" height="62" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280.0" y="708" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">B42</text><rect x="364.0" y="666" width="165.0" height="62" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="448.0" y="708" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">C3</text><g data-card="true"><rect x="28" y="752" width="504" height="120" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="795" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">Get/Update B: 2 → 3</text><text x="280" y="839" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">ผ่าน T ไม่หยุดเหมือน None</text></g><g data-card="true"><rect x="28" y="900" width="504" height="120" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="943" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">Size ยังคง 2</text><text x="280" y="987" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">Probe ได้ไม่เกิน Capacity ครั้ง</text></g><text x="28" y="1079" font-size="24" fill="#526273" text-anchor="start" font-weight="400">ภาพอธิบายเสริม • ดูเงื่อนไขในคำบรรยาย</text></g></svg>
