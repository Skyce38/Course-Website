<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="2208" viewBox="0 0 560 1104" role="img" aria-labelledby="title desc" lang="th"><title id="title">เปลี่ยนหนึ่งหมวดหมู่ One-hot ต่างสองช่อง</title><desc id="desc">Buy ใช้ full one-hot โดย Type เรียง Sport,General: query General คือ (0,1) แต่ R1 Sport คือ (1,0) จึงต่างสองช่องและเพิ่ม d²=2 ไม่ใช่ 1 ส่วน feature blocks อื่นเหมือนกัน ตัวเลขรหัส ordinal ของ Drug เป็นคนละ representation</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9" fill="#6b7e8d"/></marker><marker id="inherit" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0 0L11 6L0 12Z" fill="#fff" stroke="#6b7e8d" stroke-width="1"/></marker><marker id="aggregation" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 0L12 6L6 12Z" fill="#fff" stroke="#6b7e8d" stroke-width="1"/></marker><marker id="composition" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 0L12 6L6 12Z" fill="#6b7e8d" stroke="#6b7e8d" stroke-width="1"/></marker></defs><rect width="560" height="1104" fill="#fff"/><g font-family="Leelawadee UI, Noto Sans Thai, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="28" y="38" font-size="26" fill="#146c96" text-anchor="start" font-weight="400">STUDY / AI 07</text><text x="28" y="90" font-size="36" fill="#172b3a" text-anchor="start" font-weight="700">เปลี่ยนหนึ่งหมวดหมู่</text><text x="28" y="138" font-size="36" fill="#172b3a" text-anchor="start" font-weight="700">One-hot ต่างสองช่อง</text><text x="28" y="244" font-size="32" fill="#172b3a" text-anchor="start" font-weight="600">บล็อก Type ของ Buy</text><rect x="28.0" y="264" width="249.0" height="62" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="154.0" y="306" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">Sport</text><rect x="280.0" y="264" width="249.0" height="62" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="406.0" y="306" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">General</text><text x="28" y="378" font-size="32" fill="#172b3a" text-anchor="start" font-weight="600">Query • General</text><rect x="28.0" y="398" width="249.0" height="62" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="154.0" y="440" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">0</text><rect x="280.0" y="398" width="249.0" height="62" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="406.0" y="440" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">1</text><text x="28" y="512" font-size="32" fill="#172b3a" text-anchor="start" font-weight="600">R1 • Sport</text><rect x="28.0" y="532" width="249.0" height="62" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="154.0" y="574" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">1</text><rect x="280.0" y="532" width="249.0" height="62" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="406.0" y="574" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">0</text><text x="28" y="646" font-size="32" fill="#172b3a" text-anchor="start" font-weight="600">ผลต่างกำลังสองแต่ละช่อง</text><rect x="28.0" y="666" width="249.0" height="62" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="154.0" y="708" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">1</text><rect x="280.0" y="666" width="249.0" height="62" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="406.0" y="708" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">1</text><g data-card="true"><rect x="28" y="752" width="504" height="120" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="795" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">d² = (1−0)² + (0−1)² = 2</text><text x="280" y="839" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">d = √2 ≈ 1.414214</text></g><g data-card="true"><rect x="28" y="900" width="504" height="120" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="943" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">ต่าง m หมวด → d²=2m</text><text x="280" y="987" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">เฉพาะ full one-hot ชุดนี้</text></g><text x="28" y="1079" font-size="24" fill="#526273" text-anchor="start" font-weight="400">ภาพอธิบายเสริม • ดูเงื่อนไขในคำบรรยาย</text></g></svg>
