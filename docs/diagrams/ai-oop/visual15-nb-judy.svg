<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1992" viewBox="0 0 560 996" role="img" aria-labelledby="title desc" lang="th"><title id="title">จาก Prior × Likelihood สู่ Posterior ของ Judy</title><desc id="desc">Judy ใช้ Blonde/Average/Heavy/No และไม่ smooth: prior +3/8 กับ −5/8 คูณ conditional likelihoods ได้ scores 1/18 และ 1/125 แล้วหารผลรวม 143/2250 จึง posterior +125/143 และ −18/143 ค่าที่ normalize เป็นโมเดล ไม่ใช่ความถี่ร่วมที่สังเกต</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9" fill="#6b7e8d"/></marker><marker id="inherit" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0 0L11 6L0 12Z" fill="#fff" stroke="#6b7e8d" stroke-width="1"/></marker><marker id="aggregation" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 0L12 6L6 12Z" fill="#fff" stroke="#6b7e8d" stroke-width="1"/></marker><marker id="composition" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 0L12 6L6 12Z" fill="#6b7e8d" stroke="#6b7e8d" stroke-width="1"/></marker></defs><rect width="560" height="996" fill="#fff"/><g font-family="Leelawadee UI, Noto Sans Thai, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="28" y="38" font-size="26" fill="#146c96" text-anchor="start" font-weight="400">STUDY / AI 09</text><text x="28" y="90" font-size="36" fill="#172b3a" text-anchor="start" font-weight="700">จาก Prior × Likelihood</text><text x="28" y="138" font-size="36" fill="#172b3a" text-anchor="start" font-weight="700">สู่ Posterior ของ Judy</text><rect x="28" y="216" width="504" height="120" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="259" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">Query Judy</text><text x="280" y="303" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">Blonde / Average / Heavy / No</text><rect x="28" y="364" width="504" height="164" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="407" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">+ : prior 3/8</text><text x="280" y="451" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">× 2/3 × 2/3 × 1/3 × 3/3</text><text x="280" y="495" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">score = 1/18</text><rect x="28" y="556" width="504" height="164" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="599" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">− : prior 5/8</text><text x="280" y="643" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">× 2/5 × 1/5 × 2/5 × 2/5</text><text x="280" y="687" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">score = 1/125</text><rect x="28" y="748" width="504" height="164" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="791" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">Z = 1/18 + 1/125 = 143/2250</text><text x="280" y="835" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">+ : 125/143 ≈ 0.874126</text><text x="280" y="879" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">− : 18/143 ≈ 0.125874</text><text x="28" y="971" font-size="24" fill="#526273" text-anchor="start" font-weight="400">ภาพอธิบายเสริม • ดูเงื่อนไขในคำบรรยาย</text></g></svg>
