<rect x="28" y="686" width="504" height="120" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="729" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">hₜ=f(Wxₜ+Uhₜ₋₁+b)</text><text x="280" y="773" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">W, U, b ชุดเดียวทุกเวลา</text><rect x="28" y="834" width="504" height="120" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="877" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">3 Inputs → 1 Output</text><text x="280" y="921" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">Many-to-one เช่น Sentiment</text><text x="28" y="1013" font-size="24" fill="#526273" text-anchor="start" font-weight="400">ภาพอธิบายเสริม • ดูเงื่อนไขในคำบรรยาย</text></g></svg>
