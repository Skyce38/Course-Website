<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="2028" viewBox="0 0 560 1014" role="img" aria-labelledby="title desc" lang="th"><title id="title">Circular Queue วนช่อง Raw Buffer ไม่ใช่ลำดับ FIFO</title><desc id="desc">Capacity5ใส่ABCDEเต็มแล้วdequeue3ครั้งเหลือD,E จากนั้นenqueueF,Gให้raw(F,G,None,D,E) front3 rear2 size4 แต่FIFOคือD,E,F,G ต้องอ่าน(front+i)%5เพียงsizeครั้ง และrearหมายถึงช่องที่จะใส่ถัดไปตามโค้ดบท</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9" fill="#6b7e8d"/></marker><marker id="inherit" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0 0L11 6L0 12Z" fill="#fff" stroke="#6b7e8d" stroke-width="1"/></marker><marker id="aggregation" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 0L12 6L6 12Z" fill="#fff" stroke="#6b7e8d" stroke-width="1"/></marker><marker id="composition" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 0L12 6L6 12Z" fill="#6b7e8d" stroke="#6b7e8d" stroke-width="1"/></marker></defs><rect width="560" height="1014" fill="#fff"/><g font-family="Leelawadee UI, Noto Sans Thai, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="28" y="38" font-size="26" fill="#146c96" text-anchor="start" font-weight="400">STUDY / OOP 44</text><text x="28" y="90" font-size="36" fill="#172b3a" text-anchor="start" font-weight="700">Circular Queue วนช่อง</text><text x="28" y="138" font-size="36" fill="#172b3a" text-anchor="start" font-weight="700">Raw Buffer ไม่ใช่ลำดับ FIFO</text><text x="28" y="244" font-size="32" fill="#172b3a" text-anchor="start" font-weight="600">Index กายภาพ</text><rect x="28.0" y="264" width="97.8" height="62" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="78.4" y="306" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">0</text><rect x="128.8" y="264" width="97.8" height="62" rx="10" fil