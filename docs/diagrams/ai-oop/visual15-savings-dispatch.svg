<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="2024" viewBox="0 0 560 1012" role="img" aria-labelledby="title desc" lang="th"><title id="title">Override แล้วเรียกฐาน ขั้นต่ำเป็น Contract ที่ต้องตรวจ</title><desc id="desc">Savingsเริ่ม10000/rate0.03 apply_interestได้300แล้วdepositผ่านฐานทำให้ยอด10300/count1; withdraw9800ตรวจขั้นต่ำ500ก่อนเรียกwithdrawฐาน เหลือ500/count2 แต่withdraw1ถูกrejectที่child ไม่เรียกฐานและstateไม่เปลี่ยน สัญญาฐานที่ถอนหมดได้จึงไม่ถูกทดแทนทุกกรณี</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9" fill="#6b7e8d"/></marker><marker id="inherit" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0 0L11 6L0 12Z" fill="#fff" stroke="#6b7e8d" stroke-width="1"/></marker><marker id="aggregation" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 0L12 6L6 12Z" fill="#fff" stroke="#6b7e8d" stroke-width="1"/></marker><marker id="composition" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 0L12 6L6 12Z" fill="#6b7e8d" stroke="#6b7e8d" stroke-width="1"/></marker></defs><rect width="560" height="1012" fill="#fff"/><g font-family="Leelawadee UI, Noto Sans Thai, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="28" y="38" font-size="26" fill="#146c96" text-anchor="start" font-weight="400">STUDY / OOP 32</text><text x="28" y="90" font-size="36" fill="#172b3a" text-anchor="start" font-weight="700">Override แล้วเรียกฐาน</text><text x="28" y="138" font-size="36" fill="#172b3a" text-anchor="start" font-weight="700">ขั้นต่ำเป็น Contract ที่ต้องตรวจ</text><g data-card="true"><rect x="28" y="216" width="504" height="120" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="259" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">10000 × 0.03 = 300</text><text x="280" y="303" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">Deposit ฐาน → ยอด10300</text></g><polyline points="280,340 280,360" fill="none" stroke="#146c96" stroke-width="3" marker-end="url(#arrow)"/><g data-card="true"><rect x="28" y="364" width="504" height="120" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="407" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">Savings.withdraw(9800)</text><text x="280" y="451" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">ตรวจยอดหลังถอน ≥500</text></g><polyline points="280,488 280,508" fill="none" stroke="#146c96" stroke-width="3" marker-end="url(#arrow)"/><g data-card="true"><rect x="28" y="512" width="504" height="120" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="555" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">BankAccount.withdraw</text><text x="280" y="599" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">ผ่าน Setter → ยอด500 / Count2</text></g><g data-card="true"><rect x="28" y="660" width="504" height="120" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="703" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">Withdraw อีก 1 → Reject</text><text x="280" y="747" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">คงยอด500 / Count2</text></g><g data-card="true"><rect x="28" y="808" width="504" height="120" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="851" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">Syntax สืบทอดได้ ≠ LSP เสมอ</text><text x="280" y="895" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">ต้องตรวจสัญญาที่ Client คาดหวัง</text></g><text x="28" y="987" font-size="24" fill="#526273" text-anchor="start" font-weight="400">ภาพอธิบายเสริม • ดูเงื่อนไขในคำบรรยาย</text></g></svg>
