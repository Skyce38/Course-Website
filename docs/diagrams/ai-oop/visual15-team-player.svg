<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1836" viewBox="0 0 560 918" role="img" aria-labelledby="title desc" lang="th"><title id="title">ย้ายทีม แต่ Player เดิม Identity และประวัติยังอยู่</title><desc id="desc">TeamAรับreferenceของPlayerpเดิม เมื่อp.score goalsเป็น1 ก่อนremoveจากAแล้วaddเข้าB ไม่สร้างPlayerใหม่ จึงb.players(0) is pและgoalsยัง1 Snapshotของcontainerยังอ้างPlayerเดิมได้แม้Aเอาออกแล้ว ไม่ใช่deepcopy</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9" fill="#6b7e8d"/></marker><marker id="inherit" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0 0L11 6L0 12Z" fill="#fff" stroke="#6b7e8d" stroke-width="1"/></marker><marker id="aggregation" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 0L12 6L6 12Z" fill="#fff" stroke="#6b7e8d" stroke-width="1"/></marker><marker id="composition" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 0L12 6L6 12Z" fill="#6b7e8d" stroke="#6b7e8d" stroke-width="1"/></marker></defs><rect width="560" height="918" fill="#fff"/><g font-family="Leelawadee UI, Noto Sans Thai, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="28" y="38" font-size="26" fill="#146c96" text-anchor="start" font-weight="400">STUDY / OOP 35</text><text x="28" y="90" font-size="36" fill="#172b3a" text-anchor="start" font-weight="700">ย้ายทีม แต่ Player เดิม</text><text x="28" y="138" font-size="36" fill="#172b3a" text-anchor="start" font-weight="700">Identity และประวัติยังอยู่</text><g data-node="teamA"><rect x="28" y="216" width="210" height="68" rx="10" fill="#ffffff" stroke="#146c96" stroke-width="2"/><text x="133.0" y="260" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">Team A</text></g><g data-node="teamB"><rect x="322" y="216" width="210" height="68" rx="10" fill="#ffffff" stroke="#146c96" stroke-width="2"/><text x="427.0" y="260" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">Team B</text></g><g data-node="player"><rect x="105" y="436" width="350" height="68" rx="10" fill="#ffffff" stroke="#146c96" stroke-width="2"/><text x="280.0" y="480" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">Player p • goals=1</text></g><polyline points="133,284 230,436" fill="none" stroke="#6b7e8d" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="8 6" data-edge="teamA:player"/><polyline points="427,284 330,436" fill="none" stroke="#08776f" stroke-width="3" marker-end="url(#arrow)" data-edge="teamB:player"/><text x="60" y="356" font-size="32" fill="#172b3a" text-anchor="start" font-weight="400">เอาออก</text><text x="350" y="356" font-size="32" fill="#172b3a" text-anchor="start" font-weight="400">เพิ่มเข้า</text><rect x="28" y="566" width="504" height="120" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="609" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">p ไม่ได้ถูกสร้างใหม่ระหว่างย้าย</text><text x="280" y="653" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">b.players[0] is p → True</text><rect x="28" y="714" width="504" height="120" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="757" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">Tuple snapshot ≠ Deepcopy</text><text x="280" y="801" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">แก้ Player ยังเห็นผ่าน Alias ได้</text><text x="28" y="893" font-size="24" fill="#526273" text-anchor="start" font-weight="400">ภาพอธิบายเสริม • ดูเงื่อนไขในคำบรรยาย</text></g></svg>
