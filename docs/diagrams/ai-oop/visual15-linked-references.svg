<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="2220" viewBox="0 0 560 1110" role="img" aria-labelledby="title desc" lang="th"><title id="title">Node กับ Reference current ไม่ใช่สำเนา Node</title><desc id="desc">headและcurrentอ้างNode10ตัวเดียวกัน จากนั้นnextเชื่อม10→20→30→Noneและtailอ้างNode30 การเลื่อนcurrent=current.nextย้ายเพียงreferencecurrentไป20 ไม่เปลี่ยนheadหรือlinksและไม่คัดลอกNode</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9" fill="#6b7e8d"/></marker><marker id="inherit" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0 0L11 6L0 12Z" fill="#fff" stroke="#6b7e8d" stroke-width="1"/></marker><marker id="aggregation" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 0L12 6L6 12Z" fill="#fff" stroke="#6b7e8d" stroke-width="1"/></marker><marker id="composition" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 0L12 6L6 12Z" fill="#6b7e8d" stroke="#6b7e8d" stroke-width="1"/></marker></defs><rect width="560" height="1110" fill="#fff"/><g font-family="Leelawadee UI, Noto Sans Thai, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="28" y="38" font-size="26" fill="#146c96" text-anchor="start" font-weight="400">STUDY / OOP 25</text><text x="28" y="90" font-size="36" fill="#172b3a" text-anchor="start" font-weight="700">Node กับ Reference</text><text x="28" y="138" font-size="36" fill="#172b3a" text-anchor="start" font-weight="700">current ไม่ใช่สำเนา Node</text><g data-node="head"><rect x="28" y="216" width="170" height="68" rx="10" fill="#ffffff" stroke="#146c96" stroke-width="2"/><text x="113.0" y="260" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">head</text></g><g data-node="current"><rect x="362" y="216" width="170" height="68" rx="10" fill="#ffffff" stroke="#146c96" stroke-width="2"/><text x="447.0" y="260" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">current</text></g><g data-node="n10"><rect x="205" y="376" width="150" height="68" rx="10" fill="#ffffff" stroke="#146c96" stroke-width="2"/><text x="280.0" y="420" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">10</text></g><g data-node="n20"><rect x="205" y="516" width="150" height="68" rx="10" fill="#ffffff" stroke="#146c96" stroke-width="2"/><text x="280.0" y="560" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">20</text></g><g data-node="n30"><rect x="205" y="656" width="150" height="68" rx="10" fill="#ffffff" stroke="#146c96" stroke-width="2"/><text x="280.0" y="700" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">30</text></g><polyline points="113,284 280,376" fill="none" stroke="#146c96" stroke-width="3" marker-end="url(#arrow)" data-edge="head:n10"/><polyline points="447,284 280,376" fill="none" stroke="#08776f" stroke-width="3" marker-end="url(#arrow)" data-edge="current:n10"/><polyline points="280,444 280,516" fill="none" stroke="#146c96" stroke-width="3" marker-end="url(#arrow)" data-edge="n10:n20"/><polyline points="280,584 280,656" fill="none" stroke="#146c96" stroke-width="3" marker-end="url(#arrow)" data-edge="n20:n30"/><g data-node="tail"><rect x="28" y="656" width="150" height="68" rx="10" fill="#ffffff" stroke="#146c96" stroke-width="2"/><text x="103.0" y="700" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">tail</text></g><polyline points="178,690 205,690" fill="none" stroke="#08776f" stroke-width="3" marker-end="url(#arrow)" data-edge="tail:n30"/><g data-node="none"><rect x="205" y="796" width="150" height="68" rx="10" fill="#ffffff" stroke="#146c96" stroke-width="2"/><text x="280.0" y="840" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">None</text></g><polyline points="280,724 280,796" fill="none" stroke="#146c96" stroke-width="3" marker-end="url(#arrow)" data-edge="n30:none"/><g data-card="true"><rect x="28" y="906" width="504" height="120" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="949" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">current=current.next</text><text x="280" y="993" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">ย้าย current ไป 20; head ยังอยู่ 10</text></g><text x="28" y="1085" font-size="24" fill="#526273" text-anchor="start" font-weight="400">ภาพอธิบายเสริม • ดูเงื่อนไขในคำบรรยาย</text></g></svg>
