<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1876" viewBox="0 0 560 938" role="img" aria-labelledby="title desc" lang="th"><title id="title">Class สร้างหลาย Instance สถานะแยกกันได้</title><desc id="desc">BankAccountเป็นclassและเป็นobjectของtypeด้วย ส่วนaและbอ้างinstancesคนละตัว Aliceเริ่มbalance1000 Bobเริ่ม300 การเรียกa.depositเปลี่ยนเฉพาะสถานะAliceตามตัวอย่าง ไม่คัดลอกบัญชีแม่และไม่สรุปว่าทุกattributeเป็นอิสระเมื่อเก็บmutableobjectร่วมกัน</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9" fill="#6b7e8d"/></marker><marker id="inherit" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0 0L11 6L0 12Z" fill="#fff" stroke="#6b7e8d" stroke-width="1"/></marker><marker id="aggregation" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 0L12 6L6 12Z" fill="#fff" stroke="#6b7e8d" stroke-width="1"/></marker><marker id="composition" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 0L12 6L6 12Z" fill="#6b7e8d" stroke="#6b7e8d" stroke-width="1"/></marker></defs><rect width="560" height="938" fill="#fff"/><g font-family="Leelawadee UI, Noto Sans Thai, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="28" y="38" font-size="26" fill="#146c96" text-anchor="start" font-weight="400">STUDY / OOP 27</text><text x="28" y="90" font-size="36" fill="#172b3a" text-anchor="start" font-weight="700">Class สร้างหลาย Instance</text><text x="28" y="138" font-size="36" fill="#172b3a" text-anchor="start" font-weight="700">สถานะแยกกันได้</text><g data-node="class"><rect x="80" y="216" width="400" height="68" rx="10" fill="#ffffff" stroke="#146c96" stroke-width="2"/><text x="280.0" y="260" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">BankAccount (class)</text></g><g data-node="a"><rect x="28" y="416" width="230" height="68" rx="10" fill="#ffffff" stroke="#146c96" stroke-width="2"/><text x="143.0" y="460" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">a → Alice</text></g><g data-node="b"><rect x="302" y="416" width="230" height="68" rx="10" fill="#ffffff" stroke="#146c96" stroke-width="2"/><text x="417.0" y="460" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">b → Bob</text></g><polyline points="280,284 143,416" fill="none" stroke="#146c96" stroke-width="3" marker-end="url(#arrow)" data-edge="class:a"/><polyline points="280,284 417,416" fill="none" stroke="#146c96" stroke-width="3" marker-end="url(#arrow)" data-edge="class:b"/><text x="143" y="536" font-size="30" fill="#172b3a" text-anchor="middle" font-weight="400">balance=1000</text><text x="417" y="536" font-size="30" fill="#172b3a" text-anchor="middle" font-weight="400">balance=300</text><g data-card="true"><rect x="28" y="586" width="504" height="120" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="629" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">Methods ใช้ร่วมตาม Class</text><text x="280" y="673" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">แต่ self คือ Instance ผู้รับคำสั่ง</text></g><g data-card="true"><rect x="28" y="734" width="504" height="120" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="777" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">a.deposit(500)</text><text x="280" y="821" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">Alice=1500 แต่ Bob=300</text></g><text x="28" y="913" font-size="24" fill="#526273" text-anchor="start" font-weight="400">ภาพอธิบายเสริม • ดูเงื่อนไขในคำบรรยาย</text></g></svg>
