<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1996" viewBox="0 0 560 998" role="img" aria-labelledby="title desc" lang="th"><title id="title">ABC กับ Duck Typing ตรวจคนละเงื่อนไข</title><desc id="desc">Shapeมีabstract areaและperimeter จึงสร้างShapeหรือMissingที่ยังทำperimeterไม่ครบไม่ได้ ส่วนBadgeมีareaคืน1จึงใช้total_areaร่วมกับRectangle2×2ได้5 แม้Badgeไม่สืบทอดShapeและไม่จำเป็นต้องมีperimeter การมีmethodชื่อเดียวไม่รับรองพฤติกรรมถูก</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9" fill="#6b7e8d"/></marker><marker id="inherit" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0 0L11 6L0 12Z" fill="#fff" stroke="#6b7e8d" stroke-width="1"/></marker><marker id="aggregation" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 0L12 6L6 12Z" fill="#fff" stroke="#6b7e8d" stroke-width="1"/></marker><marker id="composition" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 0L12 6L6 12Z" fill="#6b7e8d" stroke="#6b7e8d" stroke-width="1"/></marker></defs><rect width="560" height="998" fill="#fff"/><g font-family="Leelawadee UI, Noto Sans Thai, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="28" y="38" font-size="26" fill="#146c96" text-anchor="start" font-weight="400">STUDY / OOP 34</text><text x="28" y="90" font-size="36" fill="#172b3a" text-anchor="start" font-weight="700">ABC กับ Duck Typing</text><text x="28" y="138" font-size="36" fill="#172b3a" text-anchor="start" font-weight="700">ตรวจคนละเงื่อนไข</text><g data-card="true"><rect x="28" y="216" width="504" height="120" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="259" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">Shape (ABC)</text><text x="280" y="303" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">area() + perimeter() ยัง Abstract</text></g><g data-card="true"><rect x="28" y="364" width="504" height="120" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="407" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">Missing มีแค่ area()</text><text x="280" y="451" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">สร้าง Instance → TypeError</text></g><g data-card="true"><rect x="28" y="512" width="504" height="120" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="555" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">Badge มี area() → 1</text><text x="280" y="599" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">isinstance(Badge(),Shape) → False</text></g><text x="28" y="688" font-size="32" fill="#172b3a" text-anchor="start" font-weight="600">total_area รวม Rectangle + Badge</text><rect x="28.0" y="708" width="165.0" height="62" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="112.0" y="750" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">4</text><rect x="196.0" y="708" width="165.0" height="62" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280.0" y="750" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">1</text><rect x="364.0" y="708" width="165.0" height="62" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="448.0" y="750" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">5</text><g data-card="true"><rect x="28" y="794" width="504" height="120" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="837" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">Duck Typing ใช้พฤติกรรมร่วม</text><text x="280" y="881" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">ต้องตรวจผลตาม Contract ด้วย</text></g><text x="28" y="973" font-size="24" fill="#526273" text-anchor="start" font-weight="400">ภาพอธิบายเสริม • ดูเงื่อนไขในคำบรรยาย</text></g></svg>
