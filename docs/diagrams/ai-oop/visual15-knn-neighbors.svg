 x="280.0" y="1054" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">1</text><rect x="364.0" y="1012" width="165.0" height="62" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="448.0" y="1054" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">1</text><rect x="28" y="1098" width="504" height="120" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="1141" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">ทำนาย drugC</text><text x="280" y="1185" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">ไม่ใช่ผลความแม่นยำทั่วไป</text><text x="28" y="1277" font-size="24" fill="#526273" text-anchor="start" font-weight="400">ภาพอธิบายเสริม • ดูเงื่อนไขในคำบรรยาย</text></g></svg>
