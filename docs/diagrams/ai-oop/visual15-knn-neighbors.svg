<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="2604" viewBox="0 0 560 1302" role="img" aria-labelledby="title desc" lang="th"><title id="title">เพื่อนบ้านห้าตัว โหวตจากอันดับ ไม่ใช่ทุกแถว</title><desc id="desc">Drug ใช้ query และ encoding ตาม X04 โดยไม่ scale: อันดับห้าแรก R8,R10,R4,R3,R2 ให้ labels drugC,drugY,drugX,drugC,drugC จึงเลือก drugC ด้วย 3 เสียง ระยะในภาพปัดหลังจัดอันดับ ไม่สลับ R3/R2 และไม่อ้างผลทางการแพทย์</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9" fill="#6b7e8d"/></marker><marker id="inherit" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0 0L11 6L0 12Z" fill="#fff" stroke="#6b7e8d" stroke-width="1"/></marker><marker id="aggregation" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 0L12 6L6 12Z" fill="#fff" stroke="#6b7e8d" stroke-width="1"/></marker><marker id="composition" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 0L12 6L6 12Z" fill="#6b7e8d" stroke="#6b7e8d" stroke-width="1"/></marker></defs><rect width="560" height="1302" fill="#fff"/><g font-family="Leelawadee UI, Noto Sans Thai, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="28" y="38" font-size="26" fill="#146c96" text-anchor="start" font-weight="400">STUDY / AI 08</text><text x="28" y="90" font-size="36" fill="#172b3a" text-anchor="start" font-weight="700">เพื่อนบ้านห้าตัว</text><text x="28" y="138" font-size="36" fill="#172b3a" text-anchor="start" font-weight="700">โหวตจากอันดับ ไม่ใช่ทุกแถว</text><rect x="28" y="216" width="504" height="120" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="259" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">X04 • ไม่ปรับสเกล</text><text x="280" y="303" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">Query อายุ 36 / Sex F</text><rect x="28" y="364" width="504" h