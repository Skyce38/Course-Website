<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1996" viewBox="0 0 560 998" role="img" aria-labelledby="title desc" lang="th"><title id="title">แยกหน้าที่ใน Service ขยาย Channel ผ่าน Interface</title><desc id="desc">NotificationServiceใช้Channel.formatสร้างข้อความแล้วส่งMemoryLog.record ผู้เขียนจำลองในmemoryไม่ส่งemailจริง เพิ่มPushที่ทำformatตามinterfaceแล้วใช้notifyเดิมได้ แต่จุดcompositionเลือกChannelใหม่ยังต้องปรับ ไม่อ้างว่าOCPห้ามแก้bugทุกกรณี</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9" fill="#6b7e8d"/></marker><marker id="inherit" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0 0L11 6L0 12Z" fill="#fff" stroke="#6b7e8d" stroke-width="1"/></marker><marker id="aggregation" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 0L12 6L6 12Z" fill="#fff" stroke="#6b7e8d" stroke-width="1"/></marker><marker id="composition" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 0L12 6L6 12Z" fill="#6b7e8d" stroke="#6b7e8d" stroke-width="1"/></marker></defs><rect width="560" height="998" fill="#fff"/><g font-family="Leelawadee UI, Noto Sans Thai, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="28" y="38" font-size="26" fill="#146c96" text-anchor="start" font-weight="400">STUDY / OOP 38</text><text x="28" y="90" font-size="36" fill="#172b3a" text-anchor="start" font-weight="700">แยกหน้าที่ใน Service</text><text x="28" y="138" font-size="36" fill="#172b3a" text-anchor="start" font-weight="700">ขยาย Channel ผ่าน Interface</text><text x="28" y="244" font-size="32" fill="#172b3a" text-anchor="start" font-weight="600">Implementations ของ Channel</text><rect x="28.0" y="264" width="165.0" height="62" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="112.0" y="306" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">Email</text><rect x="196.0" y="264" width="165.0" height="62" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280.0" y="306" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">SMS</text><rect x="364.0" y="264" width="165.0" height="62" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="448.0" y="306" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">Push</text><rect x="28" y="350" width="504" height="120" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="393" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">Service.notify(channel,...)</text><text x="280" y="437" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">ใช้ Interface เดียว</text><polyline points="280,474 280,494" fill="none" stroke="#146c96" stroke-width="3" marker-end="url(#arrow)"/><rect x="28" y="498" width="504" height="120" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="541" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">channel.format(&quot;A&quot;,&quot;hello&quot;)</text><text x="280" y="585" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">Push คืน &quot;Push:A:hello&quot;</text><polyline points="280,622 280,642" fill="none" stroke="#146c96" stroke-width="3" marker-end="url(#arrow)"/><rect x="28" y="646" width="504" height="120" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="689" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">MemoryLog.record(formatted)</text><text x="280" y="733" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">เก็บข้อความ 1 รายการ</text><rect x="28" y="794" width="504" height="120" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="837" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">Format / Orchestrate / Record</text><text x="280" y="881" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">เปลี่ยนได้คนละเหตุผลตาม SRP</text><text x="28" y="973" font-size="24" fill="#526273" text-anchor="start" font-weight="400">ภาพอธิบายเสริม • ดูเงื่อนไขในคำบรรยาย</text></g></svg>
