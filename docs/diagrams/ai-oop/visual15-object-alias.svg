<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="2092" viewBox="0 0 560 1046" role="img" aria-labelledby="title desc" lang="th"><title id="title">สองชื่อ อ้าง Object เดียว Alias ไม่เรียก Init ใหม่</title><desc id="desc">หลังฝาก500และถอน200 a.balance=1300 เมื่อalias=a ทั้งสองชื่ออ้างobjectเดิม แล้วalias.deposit(100)ทำให้a.balanceและalias.balanceเป็น1400พร้อมกัน Bobยัง300 การdel aลบชื่อหนึ่งไม่รับรองทำลายobjectเมื่อaliasยังอ้างอยู่</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9" fill="#6b7e8d"/></marker><marker id="inherit" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0 0L11 6L0 12Z" fill="#fff" stroke="#6b7e8d" stroke-width="1"/></marker><marker id="aggregation" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 0L12 6L6 12Z" fill="#fff" stroke="#6b7e8d" stroke-width="1"/></marker><marker id="composition" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 0L12 6L6 12Z" fill="#6b7e8d" stroke="#6b7e8d" stroke-width="1"/></marker></defs><rect width="560" height="1046" fill="#fff"/><g font-family="Leelawadee UI, Noto Sans Thai, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="28" y="38" font-size="26" fill="#146c96" text-anchor="start" font-weight="400">STUDY / OOP 28</text><text x="28" y="90" font-size="36" fill="#172b3a" text-anchor="start" font-weight="700">สองชื่อ อ้าง Object เดียว</text><text x="28" y="138" font-size="36" fill="#172b3a" text-anchor="start" font-weight="700">Alias ไม่เรียก Init ใหม่</text><g data-node="a"><rect x="28" y="216" width="180" height="68" rx="10" fill="#ffffff" stroke="#146c96" stroke-width="2"/><text x="118.0" y="260" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">a</text></g><g data-node="alias"><rect x="352" y="216" width="180" height="68" rx="10" fill="#ffffff" stroke="#146c96" stroke-width="2"/><text x="442.0" y="260" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">alias</text></g><g data-node="account"><rect x="80" y="416" width="400" height="68" rx="10" fill="#ffffff" stroke="#146c96" stroke-width="2"/><text x="280.0" y="460" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">Alice • balance 1300</text></g><polyline points="118,284 280,416" fill="none" stroke="#146c96" stroke-width="3" marker-end="url(#arrow)" data-edge="a:account"/><polyline points="442,284 280,416" fill="none" stroke="#08776f" stroke-width="3" marker-end="url(#arrow)" data-edge="alias:account"/><g data-card="true"><rect x="28" y="546" width="504" height="120" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="589" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">alias.deposit(100)</text><text x="280" y="633" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">แก้สถานะบัญชีเดิม</text></g><polyline points="280,670 280,690" fill="none" stroke="#146c96" stroke-width="3" marker-end="url(#arrow)"/><g data-card="true"><rect x="28" y="694" width="504" height="120" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="737" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">a.balance = alias.balance</text><text x="280" y="781" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">= 1400</text></g><g data-card="true"><rect x="28" y="842" width="504" height="120" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="885" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">Bob ยัง 300</text><text x="280" y="929" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">del a ไม่ลบชื่อ alias</text></g><text x="28" y="1021" font-size="24" fill="#526273" text-anchor="start" font-weight="400">ภาพอธิบายเสริม • ดูเงื่อนไขในคำบรรยาย</text></g></svg>
