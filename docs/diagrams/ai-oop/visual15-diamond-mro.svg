<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="2038" viewBox="0 0 560 1019" role="img" aria-labelledby="title desc" lang="th"><title id="title">Diamond กับ MRO super() เดินตามลำดับจริง</title><desc id="desc">DสืบทอดB,Cซึ่งสืบทอดAเหมือนกัน Pythonให้MRO D,B,C,A,object สำหรับhierarchyนี้ super()ภายในBบนinstanceDจึงไปCไม่ใช่Aโดยตรง ลูกศรสืบทอดชี้ฐาน ไม่ใช่ลำดับเรียกmethod; ลำดับMROแสดงแยกด้านล่าง</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9" fill="#6b7e8d"/></marker><marker id="inherit" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0 0L11 6L0 12Z" fill="#fff" stroke="#6b7e8d" stroke-width="1"/></marker><marker id="aggregation" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 0L12 6L6 12Z" fill="#fff" stroke="#6b7e8d" stroke-width="1"/></marker><marker id="composition" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 0L12 6L6 12Z" fill="#6b7e8d" stroke="#6b7e8d" stroke-width="1"/></marker></defs><rect width="560" height="1019" fill="#fff"/><g font-family="Leelawadee UI, Noto Sans Thai, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="28" y="38" font-size="26" fill="#146c96" text-anchor="start" font-weight="400">STUDY / OOP 31</text><text x="28" y="90" font-size="36" fill="#172b3a" text-anchor="start" font-weight="700">Diamond กับ MRO</text><text x="28" y="138" font-size="36" fill="#172b3a" text-anchor="start" font-weight="700">super() เดินตามลำดับจริง</text><g data-node="A"><rect x="205" y="216" width="150" height="68" rx="10" fill="#ffffff" stroke="#146c96" stroke-width="2"/><text x="280.0" y="260" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">A</text></g><g data-node="B"><rect x="48" y="391" width="150" height="68" rx="10" fill="#ffffff" stroke="#146c96" stroke-width="2"/><text x="123.0" y="435" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">B</text></g><g data-node="C"><rect x="362" y="391" width="150" height="68" rx="10" fill="#ffffff" stroke="#146c96" stroke-width="2"/><text x="437.0" y="435" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">C</text></g><g data-node="D"><rect x="205" y="566" width="150" height="68" rx="10" fill="#ffffff" stroke="#146c96" stroke-width="2"/><text x="280.0" y="610" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">D(B,C)</text></g><polyline points="123,391 250,284" fill="none" stroke="#6b7e8d" stroke-width="3" marker-end="url(#inherit)" data-edge="B:A"/><polyline points="437,391 310,284" fill="none" stroke="#6b7e8d" stroke-width="3" marker-end="url(#inherit)" data-edge="C:A"/><polyline points="250,566 123,459" fill="none" stroke="#6b7e8d" stroke-width="3" marker-end="url(#inherit)" data-edge="D:B"/><polyline points="310,566 437,459" fill="none" stroke="#6b7e8d" stroke-width="3" marker-end="url(#inherit)" data-edge="D:C"/><text x="28" y="709" font-size="32" fill="#172b3a" text-anchor="start" font-weight="600">MRO ก่อน object</text><rect x="28.0" y="729" width="123.0" height="62" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="91.0" y="771" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">D</text><rect x="154.0" y="729" width="123.0" height="62" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="217.0" y="771" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">B</text><rect x="280.0" y="729" width="123.0" height="62" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="343.0" y="771" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">C</text><rect x="406.0" y="729" width="123.0" height="62" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="469.0" y="771" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">A</text><g data-card="true"><rect x="28" y="815" width="504" height="120" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="858" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">super ใน B → C ในตัวอย่างนี้</text><text x="280" y="902" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">ไม่สร้าง Object พ่ออีกตัว</text></g><text x="28" y="994" font-size="24" fill="#526273" text-anchor="start" font-weight="400">ภาพอธิบายเสริม • ดูเงื่อนไขในคำบรรยาย</text></g></svg>
