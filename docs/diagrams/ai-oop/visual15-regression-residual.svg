<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="2036" viewBox="0 0 560 1018" role="img" aria-labelledby="title desc" lang="th"><title id="title">เส้น OLS กับ Residual วัดแนวตั้งที่ x เดิม</title><desc id="desc">จุดแปดต้นจาก S06 ใช้ x=เส้นผ่านศูนย์กลางและ y=ความสูงในหน่วยเดิมที่ไม่ระบุชื่อ เส้น OLS ที่ผู้เขียนบทคำนวณเพิ่มมี slope 1703/375 และ intercept −493/375; เส้นตั้งที่ x=9 เชื่อมค่าทำนาย 39.557333 กับค่าจริง 49 ไม่ใช่ระยะตั้งฉากกับเส้น</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9" fill="#6b7e8d"/></marker><marker id="inherit" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0 0L11 6L0 12Z" fill="#fff" stroke="#6b7e8d" stroke-width="1"/></marker><marker id="aggregation" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 0L12 6L6 12Z" fill="#fff" stroke="#6b7e8d" stroke-width="1"/></marker><marker id="composition" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 0L12 6L6 12Z" fill="#6b7e8d" stroke="#6b7e8d" stroke-width="1"/></marker></defs><rect width="560" height="1018" fill="#fff"/><g font-family="Leelawadee UI, Noto Sans Thai, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="28" y="38" font-size="26" fill="#146c96" text-anchor="start" font-weight="400">STUDY / AI 05</text><text x="28" y="90" font-size="36" fill="#172b3a" text-anchor="start" font-weight="700">เส้น OLS กับ Residual</text><text x="28" y="138" font-size="36" fill="#172b3a" text-anchor="start" font-weight="700">วัดแนวตั้งที่ x เดิม</text><polyline points="85,246 85,586 510,586" fill="none" stroke="#6b7e8d" stroke-width="3"/><text x="32" y="260" font-size="32" fill="#172b3a" text-anchor="start" font-weight="400">y</text><text x="503" y="630" font-size="32" fill="#172b3a" text-anchor="start" font-weight="400">x</text><text x="72" y="566" font-size="28" fill="#172b3a" text-anchor="end" font-weight="400">20</text><text x="72" y="446" font-size="28" fill="#172b3a" text-anchor="end" font-weight="400">40</text><text x="72" y="326" font-size="28" fill="#172b3a" text-anchor="end" font-weight="400">60</text><text x="132" y="623" font-size="28" fill="#172b3a" text-anchor="middle" font-weight="400">6</text><text x="273" y="623" font-size="28" fill="#172b3a" text-anchor="middle" font-weight="400">9</text><text x="461" y="623" font-size="28" fill="#172b3a" text-anchor="middle" font-weight="400">13</text><polyline points="132,520.4 461,329.664" fill="none" stroke="#146c96" stroke-width="3"/><circle cx="226" cy="466" r="7" fill="#08776f"/><circle cx="273" cy="382" r="7" fill="#08776f"/><circle cx="179" cy="514" r="7" fill="#08776f"/><circle cx="132" cy="478" r="7" fill="#08776f"/><circle cx="461" cy="316" r="7" fill="#08776f"/><circle cx="179" cy="550" r="7" fill="#08776f"/><circle cx="367" cy="406" r="7" fill="#08776f"/><circle cx="414" cy="370" r="7" fill="#08776f"/><polyline points="273,382 273,438.656" fill="none" stroke="#a53838" stroke-width="3"/><g data-card="true"><rect x="28" y="666" width="504" height="120" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="709" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">ŷ = −1.314667 + 4.541333x</text><text x="280" y="753" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">ที่ x=9: ŷ=39.557333</text></g><g data-card="true"><rect x="28" y="814" width="504" height="120" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="857" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">y=49 → e=y−ŷ=9.442667</text><text x="280" y="901" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">Residual ใช้ x เดียวกัน</text></g><text x="28" y="993" font-size="24" fill="#526273" text-anchor="start" font-weight="400">ภาพอธิบายเสริม • ดูเงื่อนไขในคำบรรยาย</text></g></svg>
