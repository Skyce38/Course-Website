<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="2476" viewBox="0 0 560 1238" role="img" aria-labelledby="title desc" lang="th"><title id="title">Postfix ใช้ Stack Pop ขวาก่อนซ้าย</title><desc id="desc">นิพจน์3 4 + 2 *เริ่มstackใหม่ อ่าน3,4แล้วpopright4,left3เพื่อบวกเป็น7 จากนั้นอ่าน2แล้วpopright2,left7คูณได้14 ต้องจบเหลือผลเดียว ส่วน10 3 −ต้อง10−3=7ไม่ใช่−7 ทุกขั้นเป็นข้อมูลคำนวณล่วงหน้าไม่ได้executecodeในเว็บ</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9" fill="#6b7e8d"/></marker><marker id="inherit" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0 0L11 6L0 12Z" fill="#fff" stroke="#6b7e8d" stroke-width="1"/></marker><marker id="aggregation" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 0L12 6L6 12Z" fill="#fff" stroke="#6b7e8d" stroke-width="1"/></marker><marker id="composition" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 0L12 6L6 12Z" fill="#6b7e8d" stroke="#6b7e8d" stroke-width="1"/></marker></defs><rect width="560" height="1238" fill="#fff"/><g font-family="Leelawadee UI, Noto Sans Thai, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="28" y="38" font-size="26" fill="#146c96" text-anchor="start" font-weight="400">STUDY / OOP 42</text><text x="28" y="90" font-size="36" fill="#172b3a" text-anchor="start" font-weight="700">Postfix ใช้ Stack</text><text x="28" y="138" font-size="36" fill="#172b3a" text-anchor="start" font-weight="700">Pop ขวาก่อนซ้าย</text><text x="28" y="244" font-size="32" fill="#172b3a" text-anchor="start" font-weight="600">อ่าน 3 • Stack ล่าง → Top</text><rect x="28.0" y="264" width="501.0" height="62" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280.0" y="306" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">3</text><text x="28" y="378" font-size="32" fill="#172b3a" text-anchor="start" font-weight="600">อ่าน 4 • Stack ล่าง → Top</text><rect x="28.0" y="398" width="249.0" height="62" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="154.0" y="440" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">3</text><rect x="280.0" y="398" width="249.0" height="62" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="406.0" y="440" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">4</text><text x="28" y="512" font-size="32" fill="#172b3a" text-anchor="start" font-weight="600">อ่าน + • Stack ล่าง → Top</text><rect x="28.0" y="532" width="501.0" height="62" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280.0" y="574" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">7</text><text x="28" y="646" font-size="32" fill="#172b3a" text-anchor="start" font-weight="600">อ่าน 2 • Stack ล่าง → Top</text><rect x="28.0" y="666" width="249.0" height="62" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="154.0" y="708" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">7</text><rect x="280.0" y="666" width="249.0" height="62" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="406.0" y="708" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">2</text><text x="28" y="780" font-size="32" fill="#172b3a" text-anchor="start" font-weight="600">อ่าน * • Stack ล่าง → Top</text><rect x="28.0" y="800" width="501.0" height="62" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280.0" y="842" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">14</text><rect x="28" y="886" width="504" height="120" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="929" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">* : Left=7 / Right=2</text><text x="280" y="973" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">7×2=14</text><rect x="28" y="1034" width="504" height="120" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="1077" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">10 3 − → Left10 − Right3 = 7</text><text x="280" y="1121" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">สลับ Operand แล้วผลเปลี่ยน</text><text x="28" y="1213" font-size="24" fill="#526273" text-anchor="start" font-weight="400">ภาพอธิบายเสริม • ดูเงื่อนไขในคำบรรยาย</text></g></svg>
