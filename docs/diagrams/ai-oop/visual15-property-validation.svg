<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1902" viewBox="0 0 560 951" role="img" aria-labelledby="title desc" lang="th"><title id="title">Property เป็นทางผ่าน ตรวจให้ผ่านก่อนแก้ State</title><desc id="desc">การassign a.balance=valueเรียกsetterซึ่งตรวจชนิดและช่วงค่าก่อนเก็บ__balance ถ้าไม่ผ่านให้raiseแล้วbalanceเดิมไม่เปลี่ยน ตัวอย่างผู้เขียนปฏิเสธbool,NaN,infinityอย่างเปิดเผย ไม่อ้างว่าunderscoreหรือname manglingเป็นระบบsecurity</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9" fill="#6b7e8d"/></marker><marker id="inherit" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0 0L11 6L0 12Z" fill="#fff" stroke="#6b7e8d" stroke-width="1"/></marker><marker id="aggregation" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 0L12 6L6 12Z" fill="#fff" stroke="#6b7e8d" stroke-width="1"/></marker><marker id="composition" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 0L12 6L6 12Z" fill="#6b7e8d" stroke="#6b7e8d" stroke-width="1"/></marker></defs><rect width="560" height="951" fill="#fff"/><g font-family="Leelawadee UI, Noto Sans Thai, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="28" y="38" font-size="26" fill="#146c96" text-anchor="start" font-weight="400">STUDY / OOP 29</text><text x="28" y="90" font-size="36" fill="#172b3a" text-anchor="start" font-weight="700">Property เป็นทางผ่าน</text><text x="28" y="138" font-size="36" fill="#172b3a" text-anchor="start" font-weight="700">ตรวจให้ผ่านก่อนแก้ State</text><g data-card="true"><rect x="28" y="216" width="504" height="120" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="259" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">a.balance = value</text><text x="280" y="303" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">เรียก @balance.setter</text></g><polyline points="280,340 280,360" fill="none" stroke="#146c96" stroke-width="3" marker-end="url(#arrow)"/><g data-card="true"><rect x="28" y="364" width="504" height="120" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="407" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">ตรวจ type / finite / ช่วงค่า</text><text x="280" y="451" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">ต้องไม่ติดลบตามสัญญานี้</text></g><g data-node="valid"><rect x="28" y="572" width="230" height="68" rx="10" fill="#ffffff" stroke="#146c96" stroke-width="2"/><text x="143.0" y="616" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">ผ่าน</text></g><g data-node="invalid"><rect x="302" y="572" width="230" height="68" rx="10" fill="#ffffff" stroke="#146c96" stroke-width="2"/><text x="417.0" y="616" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">ไม่ผ่าน</text></g><polyline points="280,487 143,572" fill="none" stroke="#08776f" stroke-width="3" marker-end="url(#arrow)" data-edge="validation:valid"/><polyline points="280,487 417,572" fill="none" stroke="#a53838" stroke-width="3" marker-end="url(#arrow)" data-edge="validation:invalid"/><text x="143" y="695" font-size="28" fill="#172b3a" text-anchor="middle" font-weight="400">เขียน __balance</text><text x="417" y="695" font-size="28" fill="#a53838" text-anchor="middle" font-weight="400">raise ก่อนเขียน</text><g data-card="true"><rect x="28" y="747" width="504" height="120" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="790" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">Setter ต้องเขียน Backing field</text><text x="280" y="834" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">ไม่เรียก self.balance ซ้ำวนไม่จบ</text></g><text x="28" y="926" font-size="24" fill="#526273" text-anchor="start" font-weight="400">ภาพอธิบายเสริม • ดูเงื่อนไขในคำบรรยาย</text></g></svg>
