<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1896" viewBox="0 0 560 948" role="img" aria-labelledby="title desc" lang="th"><title id="title">แยก HairColor ต้องถ่วงขนาดแต่ละกิ่ง</title><desc id="desc">Sunburn parent มี +3/−5 รวม8และ entropy0.954434bit; HairColor แบ่ง blonde(+2/−2)4แถว red(+1)1แถว brown(−3)3แถว จึง weighted entropy4/8×1+1/8×0+3/8×0=0.5 และ gain0.454434 ไม่เฉลี่ย entropy เท่ากันทั้งสามกิ่ง</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9" fill="#6b7e8d"/></marker><marker id="inherit" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0 0L11 6L0 12Z" fill="#fff" stroke="#6b7e8d" stroke-width="1"/></marker><marker id="aggregation" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 0L12 6L6 12Z" fill="#fff" stroke="#6b7e8d" stroke-width="1"/></marker><marker id="composition" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 0L12 6L6 12Z" fill="#6b7e8d" stroke="#6b7e8d" stroke-width="1"/></marker></defs><rect width="560" height="948" fill="#fff"/><g font-family="Leelawadee UI, Noto Sans Thai, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="28" y="38" font-size="26" fill="#146c96" text-anchor="start" font-weight="400">STUDY / AI 11</text><text x="28" y="90" font-size="36" fill="#172b3a" text-anchor="start" font-weight="700">แยก HairColor</text><text x="28" y="138" font-size="36" fill="#172b3a" text-anchor="start" font-weight="700">ต้องถ่วงขนาดแต่ละกิ่ง</text><rect x="28" y="216" width="504" height="120" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="259" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">Parent: +3 / −5</text><text x="280" y="303" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">H = 0.954434 bit</text><text x="28" y="392" font-size="32" fill="#172b3a" text-anchor="start" font-weight="600">Blonde • +2 / −2</text><rect x="28" y="412" width="48" height="36" rx="10" fill="#dceee7" stroke="#08776f" stroke-width="2"/><rect x="82" y="412" width="48" height="36" rx="10" fill="#dceee7" stroke="#08776f" stroke-width="2"/><rect x="136" y="412" width="48" height="36" rx="10" fill="#edf0f4" stroke="#6b7e8d" stroke-width="2"/><rect x="190" y="412" width="48" height="36" rx="10" fill="#edf0f4" stroke="#6b7e8d" stroke-width="2"/><text x="28" y="504" font-size="32" fill="#172b3a" text-anchor="start" font-weight="600">Red • +1 / −0</text><rect x="28" y="524" width="48" height="36" rx="10" fill="#dceee7" stroke="#08776f" stroke-width="2"/><text x="28" y="616" font-size="32" fill="#172b3a" text-anchor="start" font-weight="600">Brown • +0 / −3</text><rect x="28" y="636" width="48" height="36" rx="10" fill="#edf0f4" stroke="#6b7e8d" stroke-width="2"/><rect x="82" y="636" width="48" height="36" rx="10" fill="#edf0f4" stroke="#6b7e8d" stroke-width="2"/><rect x="136" y="636" width="48" height="36" rx="10" fill="#edf0f4" stroke="#6b7e8d" stroke-width="2"/><rect x="28" y="700" width="504" height="164" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="743" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">H หลังแบ่ง = (4/8)×1 = 0.5</text><text x="280" y="787" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">IG = 0.954434 − 0.5</text><text x="280" y="831" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">= 0.454434 bit</text><text x="28" y="923" font-size="24" fill="#526273" text-anchor="start" font-weight="400">ภาพอธิบายเสริม • ดูเงื่อนไขในคำบรรยาย</text></g></svg>
