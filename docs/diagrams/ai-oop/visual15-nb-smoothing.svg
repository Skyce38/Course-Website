<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="2144" viewBox="0 0 560 1072" role="img" aria-labelledby="title desc" lang="th"><title id="title">Zero count กับ Smoothing เป็นคนละแบบจำลอง</title><desc id="desc">Buy มี Y=N=5 และ category counts (2,2,2,3); raw Red ใน N มี count ศูนย์จึง scoreN=0 แต่ alpha=1 ใช้ตัวหาร (7,7,7,8) และ prior ยัง 1/2 ทำให้ scores225/5488 และ30/5488 แล้ว posterior Y=15/17 ไม่ใช่1</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9" fill="#6b7e8d"/></marker><marker id="inherit" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0 0L11 6L0 12Z" fill="#fff" stroke="#6b7e8d" stroke-width="1"/></marker><marker id="aggregation" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 0L12 6L6 12Z" fill="#fff" stroke="#6b7e8d" stroke-width="1"/></marker><marker id="composition" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 0L12 6L6 12Z" fill="#6b7e8d" stroke="#6b7e8d" stroke-width="1"/></marker></defs><rect width="560" height="1072" fill="#fff"/><g font-family="Leelawadee UI, Noto Sans Thai, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="28" y="38" font-size="26" fill="#146c96" text-anchor="start" font-weight="400">STUDY / AI 10</text><text x="28" y="90" font-size="36" fill="#172b3a" text-anchor="start" font-weight="700">Zero count กับ Smoothing</text><text x="28" y="138" font-size="36" fill="#172b3a" text-anchor="start" font-weight="700">เป็นคนละแบบจำลอง</text><text x="28" y="244" font-size="32" fill="#172b3a" text-anchor="start" font-weight="600">Kj ของแต่ละ feature</text><rect x="28.0" y="264" width="123.0" height="62" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="91.0" y="306" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">2</text><rect x="154.0" y="264" width="123.0" height="62" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="217.0" y="306" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">2</text><rect x="280.0" y="264" width="123.0" height="62" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="343.0" y="306" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">2</text><rect x="406.0" y="264" width="123.0" height="62" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="469.0" y="306" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">3</text><text x="28" y="378" font-size="32" fill="#172b3a" text-anchor="start" font-weight="600">ตัวหาร Nc + αKj (α=1)</text><rect x="28.0" y="398" width="123.0" height="62" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="91.0" y="440" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">7</text><rect x="154.0" y="398" width="123.0" height="62" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="217.0" y="440" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">7</text><rect x="280.0" y="398" width="123.0" height="62" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="343.0" y="440" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">7</text><rect x="406.0" y="398" width="123.0" height="62" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="469.0" y="440" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">8</text><g data-card="true"><rect x="28" y="484" width="504" height="164" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="527" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">Raw • α=0</text><text x="280" y="571" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">P(Red | N)=0 → score N=0</text><text x="280" y="615" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">Posterior Y=1 ในโมเดลนี้</text></g><g data-card="true"><rect x="28" y="676" width="504" height="164" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="719" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">Laplace • α=1</text><text x="280" y="763" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">sY=225/5488; sN=30/5488</text><text x="280" y="807" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">Posterior Y=15/17, N=2/17</text></g><g data-card="true"><rect x="28" y="868" width="504" height="120" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="911" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">Posterior ไม่ใช่ Accuracy</text><text x="280" y="955" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">ทั้งสองแบบยังเลือก Y</text></g><text x="28" y="1047" font-size="24" fill="#526273" text-anchor="start" font-weight="400">ภาพอธิบายเสริม • ดูเงื่อนไขในคำบรรยาย</text></g></svg>
