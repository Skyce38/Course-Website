<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1816" viewBox="0 0 560 908" role="img" aria-labelledby="title desc" lang="th"><title id="title">Update คือค่าเฉลี่ย ไม่ใช่จุดข้อมูลที่ใกล้สุด</title><desc id="desc">เมื่อ assign รอบ1ของ X05 เสร็จจึง update: C2สมาชิก3,4,5,6,8มีผลรวมพิกัด(30,30)หาร5ได้(6,6), C1คง(2,10), C3จุด2และ7ได้(1.5,3.5) SSEหลังupdateรอบนี้=37 ไม่ปะปนกับ43/3ของรอบสุดท้าย</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9" fill="#6b7e8d"/></marker><marker id="inherit" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0 0L11 6L0 12Z" fill="#fff" stroke="#6b7e8d" stroke-width="1"/></marker><marker id="aggregation" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 0L12 6L6 12Z" fill="#fff" stroke="#6b7e8d" stroke-width="1"/></marker><marker id="composition" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 0L12 6L6 12Z" fill="#6b7e8d" stroke="#6b7e8d" stroke-width="1"/></marker></defs><rect width="560" height="908" fill="#fff"/><g font-family="Leelawadee UI, Noto Sans Thai, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="28" y="38" font-size="26" fill="#146c96" text-anchor="start" font-weight="400">STUDY / AI 16</text><text x="28" y="90" font-size="36" fill="#172b3a" text-anchor="start" font-weight="700">Update คือค่าเฉลี่ย</text><text x="28" y="138" font-size="36" fill="#172b3a" text-anchor="start" font-weight="700">ไม่ใช่จุดข้อมูลที่ใกล้สุด</text><g data-card="true"><rect x="28" y="216" width="504" height="120" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="259" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">C2 ก่อน Update = (5,8)</text><text x="280" y="303" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">สมาชิก: 3, 4, 5, 6, 8</text></g><polyline points="280,340 280,360" fill="none" stroke="#146c96" stroke-width="3" marker-end="url(#arrow)"/><g data-card="true"><rect x="28" y="364" width="504" height="120" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="407" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">รวมพิกัดสมาชิก</text><text x="280" y="451" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">Σx=30 และ Σy=30</text></g><polyline points="280,488 280,508" fill="none" stroke="#146c96" stroke-width="3" marker-end="url(#arrow)"/><g data-card="true"><rect x="28" y="512" width="504" height="120" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="555" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">หารจำนวนสมาชิก 5</text><text x="280" y="599" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">C2 ใหม่ = (6,6)</text></g><g data-card="true"><rect x="28" y="660" width="504" height="164" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="703" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">C1 ใหม่ = (2,10)</text><text x="280" y="747" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">C3 ใหม่ = (1.5,3.5)</text><text x="280" y="791" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">SSE หลัง Update = 37</text></g><text x="28" y="883" font-size="24" fill="#526273" text-anchor="start" font-weight="400">ภาพอธิบายเสริม • ดูเงื่อนไขในคำบรรยาย</text></g></svg>
