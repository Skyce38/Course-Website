<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="2188" viewBox="0 0 560 1094" role="img" aria-labelledby="title desc" lang="th"><title id="title">แทรก 25 หลัง 20 เก็บทางไป 30 ก่อน</title><desc id="desc">ก่อนแทรก20.nextอ้าง30 ขั้นแรกnew_node.next=current.nextเชื่อม25ไป30 แล้วcurrent.next=new_nodeจึงเชื่อม20ไป25 ได้10→20→25→30→None; ถ้าสลับสองคำสั่งจะเสี่ยง25ชี้ตัวเองและเสียทางไป30 ตามตัวอย่างบทเดิม ไม่เพิ่ม deletion algorithm ใหม่</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9" fill="#6b7e8d"/></marker><marker id="inherit" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0 0L11 6L0 12Z" fill="#fff" stroke="#6b7e8d" stroke-width="1"/></marker><marker id="aggregation" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 0L12 6L6 12Z" fill="#fff" stroke="#6b7e8d" stroke-width="1"/></marker><marker id="composition" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 0L12 6L6 12Z" fill="#6b7e8d" stroke="#6b7e8d" stroke-width="1"/></marker></defs><rect width="560" height="1094" fill="#fff"/><g font-family="Leelawadee UI, Noto Sans Thai, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="28" y="38" font-size="26" fill="#146c96" text-anchor="start" font-weight="400">STUDY / OOP 26</text><text x="28" y="90" font-size="36" fill="#172b3a" text-anchor="start" font-weight="700">แทรก 25 หลัง 20</text><text x="28" y="138" font-size="36" fill="#172b3a" text-anchor="start" font-weight="700">เก็บทางไป 30 ก่อน</text><text x="28" y="244" font-size="32" fill="#172b3a" text-anchor="start" font-weight="600">ก่อน: 20.next → 30</text><rect x="28.0" y="264" width="165.0" height="62" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="112.0" y="306" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">10</text><rect x="196.0" y="264" width="165.0" height="62" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280.0" y="306" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">20</text><rect x="364.0" y="264" width="165.0" height="62" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="448.0" y="306" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">30</text><g data-card="true"><rect x="28" y="350" width="504" height="120" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="393" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">1. new_node.next = current.next</text><text x="280" y="437" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">ให้ 25.next → 30 ก่อน</text></g><g data-node="n25"><rect x="28" y="498" width="180" height="68" rx="10" fill="#ffffff" stroke="#146c96" stroke-width="2"/><text x="118.0" y="542" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">25</text></g><g data-node="n30"><rect x="352" y="498" width="180" height="68" rx="10" fill="#ffffff" stroke="#146c96" stroke-width="2"/><text x="442.0" y="542" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">30</text></g><polyline points="208,532 352,532" fill="none" stroke="#08776f" stroke-width="3" marker-end="url(#arrow)" data-edge="n25:n30"/><g data-card="true"><rect x="28" y="608" width="504" height="120" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="651" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">2. current.next = new_node</text><text x="280" y="695" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">ให้ 20.next → 25</text></g><text x="28" y="784" font-size="32" fill="#172b3a" text-anchor="start" font-weight="600">หลัง: 10 → 20 → 25 → 30</text><rect x="28.0" y="804" width="123.0" height="62" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="91.0" y="846" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">10</text><rect x="154.0" y="804" width="123.0" height="62" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="217.0" y="846" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">20</text><rect x="280.0" y="804" width="123.0" height="62" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="343.0" y="846" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">25</text><rect x="406.0" y="804" width="123.0" height="62" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="469.0" y="846" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">30</text><g data-card="true"><rect x="28" y="890" width="504" height="120" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="933" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">Head/Tail ไม่เปลี่ยนในตัวอย่างนี้</text><text x="280" y="977" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">ค้นหาตำแหน่งก่อนอาจใช้ O(n)</text></g><text x="28" y="1069" font-size="24" fill="#526273" text-anchor="start" font-weight="400">ภาพอธิบายเสริม • ดูเงื่อนไขในคำบรรยาย</text></g></svg>
