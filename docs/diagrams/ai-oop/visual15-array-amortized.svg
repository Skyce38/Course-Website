<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="2160" viewBox="0 0 560 1080" role="img" aria-labelledby="title desc" lang="th"><title id="title">แปด Appends มีต้นทุน15 Amortized ไม่ใช่ทุกครั้ง O(1)</title><desc id="desc">ในโมเดลเริ่มcapacity1และdoubling ต้นทุนwriteใหม่บวกcopyแต่ละappendคือ1,2,3,1,5,1,1,1 รวม15เฉลี่ย15/8=1.875 หน่วย; รอบที่5แพง5หน่วยจึงไม่ใช่เวลาคงที่ทุกcall การพิสูจน์ทั้งลำดับไม่ต้องสมมติinputสุ่มและไม่ใช่เวลาจริงของCPython</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9" fill="#6b7e8d"/></marker><marker id="inherit" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0 0L11 6L0 12Z" fill="#fff" stroke="#6b7e8d" stroke-width="1"/></marker><marker id="aggregation" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 0L12 6L6 12Z" fill="#fff" stroke="#6b7e8d" stroke-width="1"/></marker><marker id="composition" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 0L12 6L6 12Z" fill="#6b7e8d" stroke="#6b7e8d" stroke-width="1"/></marker></defs><rect width="560" height="1080" fill="#fff"/><g font-family="Leelawadee UI, Noto Sans Thai, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="28" y="38" font-size="26" fill="#146c96" text-anchor="start" font-weight="400">STUDY / OOP 40</text><text x="28" y="90" font-size="36" fill="#172b3a" text-anchor="start" font-weight="700">แปด Appends มีต้นทุน15</text><text x="28" y="138" font-size="36" fill="#172b3a" text-anchor="start" font-weight="700">Amortized ไม่ใช่ทุกครั้ง O(1)</text><text x="28" y="248" font-size="32" fill="#172b3a" text-anchor="start" font-weight="400">1</text><rect x="78" y="216" width="72" height="42" rx="10" fill="#e9f2f6" stroke="#d0dbe2" stroke-width="2"/><text x="164" y="248" font-size="32" fill="#172b3a" text-anchor="start" font-weight="400">1</text><text x="28" y="312" font-size="32" fill="#172b3a" text-anchor="start" font-weight="400">2</text><rect x="78" y="280" width="144" height="42" rx="10" fill="#dceee7" stroke="#d0dbe2" stroke-width="2"/><text x="236" y="312" font-size="32" fill="#172b3a" text-anchor="start" font-weight="400">2</text><text x="28" y="376" font-size="32" fill="#172b3a" text-anchor="start" font-weight="400">3</text><rect x="78" y="344" width="216" height="42" rx="10" fill="#dceee7" stroke="#d0dbe2" stroke-width="2"/><text x="308" y="376" font-size="32" fill="#172b3a" text-anchor="start" font-weight="400">3</text><text x="28" y="440" font-size="32" fill="#172b3a" text-anchor="start" font-weight="400">4</text><rect x="78" y="408" width="72" height="42" rx="10" fill="#e9f2f6" stroke="#d0dbe2" stroke-width="2"/><text x="164" y="440" font-size="32" fill="#172b3a" text-anchor="start" font-weight="400">1</text><text x="28" y="504" font-size="32" fill="#172b3a" text-anchor="start" font-weight="400">5</text><rect x="78" y="472" width="360" height="42" rx="10" fill="#dceee7" stroke="#d0dbe2" stroke-width="2"/><text x="452" y="504" font-size="32" fill="#172b3a" text-anchor="start" font-weight="400">5</text><text x="28" y="568" font-size="32" fill="#172b3a" text-anchor="start" font-weight="400">6</text><rect x="78" y="536" width="72" height="42" rx="10" fill="#e9f2f6" stroke="#d0dbe2" stroke-width="2"/><text x="164" y="568" font-size="32" fill="#172b3a" text-anchor="start" font-weight="400">1</text><text x="28" y="632" font-size="32" fill="#172b3a" text-anchor="start" font-weight="400">7</text><rect x="78" y="600" width="72" height="42" rx="10" fill="#e9f2f6" stroke="#d0dbe2" stroke-width="2"/><text x="164" y="632" font-size="32" fill="#172b3a" text-anchor="start" font-weight="400">1</text><text x="28" y="696" font-size="32" fill="#172b3a" text-anchor="start" font-weight="400">8</text><rect x="78" y="664" width="72" height="42" rx="10" fill="#e9f2f6" stroke="#d0dbe2" stroke-width="2"/><text x="164" y="696" font-size="32" fill="#172b3a" text-anchor="start" font-weight="400">1</text><g data-card="true"><rect x="28" y="728" width="504" height="120" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="771" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">รวม 8 Writes + 7 Copies = 15</text><text x="280" y="815" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">เฉลี่ย 15/8 = 1.875</text></g><g data-card="true"><rect x="28" y="876" width="504" height="120" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="919" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">ลำดับ n ครั้งใช้ O(n)</text><text x="280" y="963" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">ต่อครั้ง Amortized O(1)</text></g><text x="28" y="1055" font-size="24" fill="#526273" text-anchor="start" font-weight="400">ภาพอธิบายเสริม • ดูเงื่อนไขในคำบรรยาย</text></g></svg>
