<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1968" viewBox="0 0 560 984" role="img" aria-labelledby="title desc" lang="th"><title id="title">Linked Queue แบบ FIFO เพิ่มท้าย นำออกหน้า</title><desc id="desc">enqueueAแล้วBแล้วCให้headอ้างAและtailอ้างC dequeueคืนAและย้ายheadไปBโดยtailยังC ถ้าเหลือsingletonแล้วdequeueต้องตั้งทั้งheadและtailเป็นNone เพื่อให้enqueueครั้งถัดไปเริ่มใหม่ถูกต้อง ไม่ใช้list.pop(0)แล้วอ้างO(1)</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9" fill="#6b7e8d"/></marker><marker id="inherit" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0 0L11 6L0 12Z" fill="#fff" stroke="#6b7e8d" stroke-width="1"/></marker><marker id="aggregation" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 0L12 6L6 12Z" fill="#fff" stroke="#6b7e8d" stroke-width="1"/></marker><marker id="composition" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 0L12 6L6 12Z" fill="#6b7e8d" stroke="#6b7e8d" stroke-width="1"/></marker></defs><rect width="560" height="984" fill="#fff"/><g font-family="Leelawadee UI, Noto Sans Thai, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="28" y="38" font-size="26" fill="#146c96" text-anchor="start" font-weight="400">STUDY / OOP 43</text><text x="28" y="90" font-size="36" fill="#172b3a" text-anchor="start" font-weight="700">Linked Queue แบบ FIFO</text><text x="28" y="138" font-size="36" fill="#172b3a" text-anchor="start" font-weight="700">เพิ่มท้าย นำออกหน้า</text><text x="28" y="244" font-size="32" fill="#172b3a" text-anchor="start" font-weight="600">Front → ลำดับ FIFO → Rear</text><rect x="28.0" y="264" width="165.0" height="62" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="112.0" y="306" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">A</text><rect x="196.0" y="264" width="165.0" height="62" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280.0" y="306" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">B</text><rect x="364.0" y="264" width="165.0" height="62" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="448.0" y="306" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">C</text><g data-card="true"><rect x="28" y="350" width="504" height="120" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="393" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">Enqueue ที่ Rear</text><text x="280" y="437" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">Dequeue ที่ Front → คืน A</text></g><text x="28" y="526" font-size="32" fill="#172b3a" text-anchor="start" font-weight="600">หลังนำ A ออก: Head=B / Tail=C</text><rect x="28.0" y="546" width="249.0" height="62" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="154.0" y="588" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">B</text><rect x="280.0" y="546" width="249.0" height="62" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="406.0" y="588" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">C</text><g data-card="true"><rect x="28" y="632" width="504" height="120" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="675" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">ถ้าเหลือ Node เดียว</text><text x="280" y="719" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">Head และ Tail อ้าง Node เดียวกัน</text></g><polyline points="280,756 280,776" fill="none" stroke="#146c96" stroke-width="3" marker-end="url(#arrow)"/><g data-card="true"><rect x="28" y="780" width="504" height="120" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="823" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">Dequeue ตัวสุดท้าย</text><text x="280" y="867" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">Head=None / Tail=None</text></g><text x="28" y="959" font-size="24" fill="#526273" text-anchor="start" font-weight="400">ภาพอธิบายเสริม • ดูเงื่อนไขในคำบรรยาย</text></g></svg>
