<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1760" viewBox="0 0 560 880" role="img" aria-labelledby="title desc" lang="th"><title id="title">เดินตามกิ่ง หนึ่ง Path คือเงื่อนไข AND</title><desc id="desc">ต้นไม้ Sunburn ใช้ HairColor เป็น root: redให้+ brownให้− ส่วน blonde ต้องตรวจ Lotion ต่อโดย noให้+ และyesให้− เส้นทาง blonde AND Lotion=no จึงให้+ และไม่ต้องตรวจ attribute ที่ไม่มีใน path ไม่อ้างเป็นกฎทางการแพทย์สากล</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9" fill="#6b7e8d"/></marker><marker id="inherit" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0 0L11 6L0 12Z" fill="#fff" stroke="#6b7e8d" stroke-width="1"/></marker><marker id="aggregation" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 0L12 6L6 12Z" fill="#fff" stroke="#6b7e8d" stroke-width="1"/></marker><marker id="composition" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 0L12 6L6 12Z" fill="#6b7e8d" stroke="#6b7e8d" stroke-width="1"/></marker></defs><rect width="560" height="880" fill="#fff"/><g font-family="Leelawadee UI, Noto Sans Thai, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="28" y="38" font-size="26" fill="#146c96" text-anchor="start" font-weight="400">STUDY / AI 12</text><text x="28" y="90" font-size="36" fill="#172b3a" text-anchor="start" font-weight="700">เดินตามกิ่ง</text><text x="28" y="138" font-size="36" fill="#172b3a" text-anchor="start" font-weight="700">หนึ่ง Path คือเงื่อนไข AND</text><g data-node="hair"><rect x="180" y="216" width="200" height="68" rx="10" fill="#ffffff" stroke="#146c96" stroke-width="2"/><text x="280.0" y="260" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">HairColor</text></g><g data-node="red"><rect x="28" y="391" width="144" height="112" rx="10" fill="#ffffff" stroke="#146c96" stroke-width="2"/><text x="100.0" y="435" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">Red</text><text x="100.0" y="479" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">+</text></g><polyline points="280,284 100,391" fill="none" stroke="#146c96" stroke-width="3" marker-end="url(#arrow)" data-edge="hair:red"/><g data-node="lotion"><rect x="208" y="391" width="144" height="68" rx="10" fill="#ffffff" stroke="#146c96" stroke-width="2"/><text x="280.0" y="435" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">Lotion</text></g><polyline points="280,284 280,391" fill="none" stroke="#146c96" stroke-width="3" marker-end="url(#arrow)" data-edge="hair:lotion"/><g data-node="brown"><rect x="388" y="391" width="144" height="112" rx="10" fill="#ffffff" stroke="#146c96" stroke-width="2"/><text x="460.0" y="435" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">Brown</text><text x="460.0" y="479" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">−</text></g><polyline points="280,284 460,391" fill="none" stroke="#146c96" stroke-width="3" marker-end="url(#arrow)" data-edge="hair:brown"/><text x="280" y="352" font-size="30" fill="#172b3a" text-anchor="middle" font-weight="400">Blonde</text><g data-node="no"><rect x="100" y="566" width="150" height="68" rx="10" fill="#ffffff" stroke="#146c96" stroke-width="2"/><text x="175.0" y="610" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">No → +</text></g><polyline points="280,459 175,566" fill="none" stroke="#08776f" stroke-width="3" marker-end="url(#arrow)" data-edge="lotion:no"/><g data-node="yes"><rect x="320" y="566" width="150" height="68" rx="10" fill="#ffffff" stroke="#146c96" stroke-width="2"/><text x="395.0" y="610" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">Yes → −</text></g><polyline points="280,459 395,566" fill="none" stroke="#08776f" stroke-width="3" marker-end="url(#arrow)" data-edge="lotion:yes"/><g data-card="true"><rect x="28" y="676" width="504" height="120" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="719" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">Blonde AND Lotion=No → +</text><text x="280" y="763" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">กฎนี้อิงชุดข้อมูล ไม่ใช่กฎสากล</text></g><text x="28" y="855" font-size="24" fill="#526273" text-anchor="start" font-weight="400">ภาพอธิบายเสริม • ดูเงื่อนไขในคำบรรยาย</text></g></svg>
