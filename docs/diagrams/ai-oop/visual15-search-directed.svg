<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1960" viewBox="0 0 560 980" role="img" aria-labelledby="title desc" lang="th"><title id="title">กราฟกำหนดทิศทาง อ่านเพื่อนบ้านตาม tuple</title><desc id="desc">กราฟตัวอย่างที่ผู้เขียนบทสร้างมี S→A,B; A→C; B→G; C→D; D→S,G และ G ไม่มีลูก ต้องคงวงจร D→S แต่ข้ามสถานะที่เคยค้นพบแล้วในการค้นหาแบบกราฟ ไม่วาดขอบย้อนทุกเส้นเอง</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9" fill="#6b7e8d"/></marker><marker id="inherit" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0 0L11 6L0 12Z" fill="#fff" stroke="#6b7e8d" stroke-width="1"/></marker><marker id="aggregation" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 0L12 6L6 12Z" fill="#fff" stroke="#6b7e8d" stroke-width="1"/></marker><marker id="composition" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 6L6 0L12 6L6 12Z" fill="#6b7e8d" stroke="#6b7e8d" stroke-width="1"/></marker></defs><rect width="560" height="980" fill="#fff"/><g font-family="Leelawadee UI, Noto Sans Thai, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="28" y="38" font-size="26" fill="#146c96" text-anchor="start" font-weight="400">STUDY / AI 03</text><text x="28" y="90" font-size="36" fill="#172b3a" text-anchor="start" font-weight="700">กราฟกำหนดทิศทาง</text><text x="28" y="138" font-size="36" fill="#172b3a" text-anchor="start" font-weight="700">อ่านเพื่อนบ้านตาม tuple</text><g data-node="S"><rect x="190" y="216" width="100" height="68" rx="10" fill="#ffffff" stroke="#146c96" stroke-width="2"/><text x="240.0" y="260" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">S</text></g><g data-node="A"><rect x="48" y="366" width="100" height="68" rx="10" fill="#ffffff" stroke="#146c96" stroke-width="2"/><text x="98.0" y="410" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">A</text></g><g data-node="B"><rect x="350" y="366" width="100" height="68" rx="10" fill="#ffffff" stroke="#146c96" stroke-width="2"/><text x="400.0" y="410" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">B</text></g><g data-node="C"><rect x="48" y="516" width="100" height="68" rx="10" fill="#ffffff" stroke="#146c96" stroke-width="2"/><text x="98.0" y="560" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">C</text></g><g data-node="D"><rect x="48" y="666" width="100" height="68" rx="10" fill="#ffffff" stroke="#146c96" stroke-width="2"/><text x="98.0" y="710" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">D</text></g><g data-node="G"><rect x="350" y="666" width="100" height="68" rx="10" fill="#ffffff" stroke="#146c96" stroke-width="2"/><text x="400.0" y="710" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">G</text></g><polyline points="240,284 98,366" fill="none" stroke="#146c96" stroke-width="3" marker-end="url(#arrow)" data-edge="S:A"/><polyline points="240,284 400,366" fill="none" stroke="#146c96" stroke-width="3" marker-end="url(#arrow)" data-edge="S:B"/><polyline points="98,434 98,516" fill="none" stroke="#146c96" stroke-width="3" marker-end="url(#arrow)" data-edge="A:C"/><polyline points="400,434 400,666" fill="none" stroke="#146c96" stroke-width="3" marker-end="url(#arrow)" data-edge="B:G"/><polyline points="98,584 98,666" fill="none" stroke="#146c96" stroke-width="3" marker-end="url(#arrow)" data-edge="C:D"/><polyline points="98,734 400,666" fill="none" stroke="#146c96" stroke-width="3" marker-end="url(#arrow)" data-edge="D:G"/><polyline points="48,700 15,700 15,250 190,250" fill="none" stroke="#08776f" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="8 6" data-edge="D:S"/><rect x="28" y="776" width="504" height="120" rx="10" fill="#f2f6f8" stroke="#d0dbe2" stroke-width="2"/><text x="280" y="819" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="600">D → S ยังอยู่ในกราฟ</text><text x="280" y="863" font-size="32" fill="#172b3a" text-anchor="middle" font-weight="400">discovered ช่วยกันการวนซ้ำ</text><text x="28" y="955" font-size="24" fill="#526273" text-anchor="start" font-weight="400">ภาพอธิบายเสริม • ดูเงื่อนไขในคำบรรยาย</text></g></svg>
