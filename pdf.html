<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PDF Viewer · Course Website</title>
  <link rel="stylesheet" href="assets/foundation.css">
  <link rel="stylesheet" href="assets/preferences.css?v=phase8-exam-1">
  <script src="assets/preferences.js?v=phase8-exam-1"></script><script src="assets/i18n.js?v=phase8-exam-1"></script><script src="assets/study.js?v=phase8-exam-1"></script>
  <script src="assets/pdf-source.js?v=phase8-exam-1" defer></script>
  <script src="assets/pdf.js?v=phase8-exam-1" defer></script>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg"><link rel="stylesheet" href="assets/readers.css?v=phase8-exam-1"></head>
<body class="foundation pdf-reader">
  <header class="foundation-header"><a class="brand" href="./"><span class="brand-symbol"><svg viewBox="0 0 40 40" width="40" height="40" aria-hidden="true" focusable="false"><use href="assets/study-icon.svg#book"/></svg></span><strong>Course Website</strong></a><nav><button class="icon-button" id="theme">◐</button> <a class="read-link" href="settings.html" data-i18n="settings">ตั้งค่า</a></nav></header>
  <main class="foundation-content pdf-content">
    <a class="back-link" id="pdf-back" href="./" data-i18n="backLibrary">← กลับคลังเรียน</a>
    <p class="eyebrow">DOCUMENT READER</p><h1 id="pdf-title">PDF Viewer</h1>
    <form id="pdf-controls" class="pdf-controls" hidden>
      <button class="icon-button" type="button" id="pdf-prev" data-i18n="previous">ก่อนหน้า</button>
      <label><span data-i18n="page">หน้า</span> <input id="pdf-page" type="number" min="1" max="10000" value="1" required inputmode="numeric"> <span id="pdf-total"></span></label>
      <button class="icon-button" type="submit" data-i18n="go">ไป</button>
      <button class="icon-button" type="button" id="pdf-next" data-i18n="next">ถัดไป</button>
      <label><span data-i18n="zoom">ซูม</span> <select id="pdf-zoom"><option value="page-width" data-i18n="fitWidth">พอดีความกว้าง</option><option value="100">100%</option><option value="125">125%</option><option value="150">150%</option><option value="200">200%</option></select></label>
    </form>
    <p id="pdf-status" role="status" data-i18n="loadingPDF">กำลังตรวจเอกสาร…</p>
    <div id="pdf-fallback" class="document-fallback" hidden>
      <p data-i18n="pdfFallback">หากเอกสารไม่แสดงหรือเบราว์เซอร์ไม่รองรับ ให้เปิดไฟล์หรือดาวน์โหลดแทน</p>
      <a id="pdf-open" class="read-link" target="_blank" rel="noopener" data-i18n="openPDF">เปิด PDF ↗</a>
      <a id="pdf-download" class="read-link" download data-i18n="download">ดาวน์โหลด</a>
      <button id="pdf-native" class="icon-button" type="button" data-i18n="nativeViewer">ตัวอ่านของเบราว์เซอร์</button>
      <button id="pdf-retry" class="icon-button" type="button" data-i18n="retry">ลองอีกครั้ง</button>
    </div>
    <div id="pdf-pages" tabindex="0" role="region" aria-label="เอกสาร PDF" data-i18n-aria-label="pdfDocument" hidden></div>
    <iframe id="pdf-frame" title="เอกสาร PDF" data-i18n-title="pdfDocument" hidden></iframe>
    <p class="small-note" id="pdf-note" data-i18n="trackedPDFNote">ใช้ตัวอ่าน PDF ของเบราว์เซอร์ การซูมและเปลี่ยนหน้าขึ้นอยู่กับเบราว์เซอร์ หากปุ่มไม่ตอบสนอง ให้ใช้แถบเครื่องมือในเอกสาร</p>
  </main>
</body>
</html>
